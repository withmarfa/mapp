<title>Marfa types</title>
<style>
:root {
  color-scheme: light dark;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, Helvetica, Arial, sans-serif;
  --bg: #ffffff;
  --bg-side: #fafafa;
  --fg: #27272a;
  --fg-strong: #09090b;
  --muted: #71717a;
  --border: #e4e4e7;
  --subtle: #f4f4f5;
  --accent: #007aff;
  --accent-soft: rgba(0, 122, 255, 0.07);
  --ring: rgba(0, 122, 255, 0.22);
  --radius: 8px;
  --side: 280px;
  --prose: 760px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #09090b;
    --bg-side: #0e0e10;
    --fg: #d4d4d8;
    --fg-strong: #fafafa;
    --muted: #a1a1aa;
    --border: #27272a;
    --subtle: #18181b;
    --accent: #0a84ff;
    --accent-soft: rgba(10, 132, 255, 0.1);
    --ring: rgba(10, 132, 255, 0.3);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.6 var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
input, button { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Sidebar */
.sidebar {
  position: fixed; top: 0; bottom: 0; left: 0;
  width: var(--side);
  display: flex; flex-direction: column;
  background: var(--bg-side);
  border-right: 1px solid var(--border);
}
.side-head { padding: 20px 16px 10px; }
.brand {
  display: block; margin: 0 0 12px 2px;
  font-size: 15px; font-weight: 600; color: var(--fg-strong);
}
.brand:hover { text-decoration: none; }
.search {
  width: 100%; height: 36px; padding: 0 12px;
  font-size: 14px;
  background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px;
  outline: none;
}
.search::placeholder { color: var(--muted); }
.search:focus, .search:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
.nav { flex: 1; overflow-y: auto; padding: 6px 10px 32px; overscroll-behavior: contain; }
.nav-item {
  display: block; padding: 4px 10px; border-radius: 6px;
  font-size: 13.5px; line-height: 1.45; color: var(--fg);
}
.nav-item:hover { background: var(--subtle); text-decoration: none; }
.nav-item.active { background: var(--subtle); color: var(--fg-strong); font-weight: 500; }
.nav-top { font-weight: 500; color: var(--fg-strong); }
.nav-item[hidden], .group[hidden], .group-items[hidden] { display: none; }
.group { margin-top: 14px; }
.group-title {
  display: flex; align-items: center; gap: 8px;
  width: 100%; margin: 0 0 2px; padding: 4px 10px;
  background: none; border: 0; border-radius: 6px;
  font-size: 12px; font-weight: 600; color: var(--muted);
  text-align: left; cursor: pointer;
}
.group-title:hover { background: var(--subtle); color: var(--fg); }
.gt-name { flex: 1; }
.gt-count { font-weight: 400; }
.chev {
  width: 6px; height: 6px; margin: 0 2px 3px 2px;
  border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
  transform: rotate(45deg);
  transition: transform 0.15s ease;
}
.group.closed .chev { transform: rotate(-45deg); margin-bottom: 0; }
.nav-empty { padding: 12px 10px; font-size: 13.5px; color: var(--muted); }

/* Main column, centred in the space beside the sidebar */
.main { margin-left: var(--side); min-width: 0; }
.doc { max-width: 960px; margin: 0 auto; padding: 56px 48px 112px; }
h1 {
  margin: 0; font-size: 32px; line-height: 1.2; font-weight: 600;
  letter-spacing: -0.02em; color: var(--fg-strong);
}
.type-id { margin: 6px 0 0; font-size: 17px; font-weight: 500; color: var(--muted); overflow-wrap: anywhere; }
.desc { margin: 20px 0 0; font-size: 16px; line-height: 1.65; max-width: var(--prose); }
.lede { margin: 12px 0 0; font-size: 16px; line-height: 1.6; color: var(--muted); max-width: var(--prose); }
.lede + .lede { margin-top: 6px; }
.facts {
  display: flex; flex-wrap: wrap; gap: 6px 28px;
  margin: 26px 0 0; padding: 14px 0;
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  font-size: 13.5px; line-height: 1.55;
}
.facts > div { display: flex; gap: 6px; min-width: 0; }
.facts dt { color: var(--muted); white-space: nowrap; }
.facts dd { margin: 0; color: var(--fg); overflow-wrap: anywhere; }
section { margin-top: 44px; }
h2 {
  margin: 0 0 14px; font-size: 18px; line-height: 1.3; font-weight: 600;
  letter-spacing: -0.01em; color: var(--fg-strong);
}
h2 .count { margin-left: 6px; font-size: 15px; font-weight: 400; color: var(--muted); }
h3 { margin: 26px 0 10px; font-size: 14.5px; font-weight: 500; color: var(--fg-strong); }
h3 .muted { margin-left: 6px; font-weight: 400; color: var(--muted); }
.section-note { margin: -6px 0 14px; font-size: 13.5px; color: var(--muted); }
.ident { font-weight: 500; color: var(--fg-strong); }
a.ident { color: var(--accent); }
.muted { color: var(--muted); }
.empty { margin: 0; font-size: 14px; color: var(--muted); }

/* Tables */
.table-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 14px; line-height: 1.55; }
table.plain { table-layout: auto; }
col.c-field { width: 21%; }
col.c-type { width: 19%; }
col.c-req { width: 10%; }
th {
  padding: 9px 14px; text-align: left; vertical-align: bottom;
  font-size: 12.5px; font-weight: 500; color: var(--muted);
  background: var(--subtle); border-bottom: 1px solid var(--border);
}
th .ident { color: inherit; }
td { padding: 12px 14px; vertical-align: top; border-top: 1px solid var(--border); overflow-wrap: break-word; }
tbody tr:first-child td { border-top: 0; }
tr.match td { background: var(--accent-soft); }
.fname { font-weight: 500; color: var(--fg-strong); overflow-wrap: break-word; }
.type { color: var(--fg); }
.note { display: block; margin-top: 2px; font-size: 13px; line-height: 1.5; color: var(--muted); }
.val { font-weight: 500; color: var(--fg); }
.req { font-weight: 500; color: var(--fg-strong); }
.opt { color: var(--muted); }

/* Definition lists */
.kv { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 8px 28px; margin: 0; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.kv .sub { grid-column: 1 / -1; margin-top: 6px; font-size: 12.5px; font-weight: 500; color: var(--muted); }

/* Overview and search results: a light tree, no boxes */
.ov-group { margin-top: 44px; }
.tree { list-style: none; margin: 0; padding: 0; }
.tree .tree { margin: 0 0 2px 4px; padding-left: 20px; border-left: 1px solid var(--border); }
.ov-row { padding: 7px 0; }
.ov-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.ov-label { font-weight: 500; color: var(--fg-strong); }
.ov-id { font-size: 13px; color: var(--muted); }
.ov-rel { margin-left: auto; font-size: 13px; color: var(--muted); }
.ov-desc { margin: 1px 0 0; font-size: 14px; line-height: 1.55; color: var(--muted); max-width: var(--prose); }
.ov-fields { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.failures { margin: 20px 0 0; font-size: 13.5px; color: var(--muted); }
.failures ul { margin: 6px 0 0; padding-left: 18px; }

/* Guide pages */
.guide h2 { margin-top: 40px; }
.guide p, .guide ul { max-width: var(--prose); margin: 0 0 14px; font-size: 15.5px; line-height: 1.7; }
.guide .lede { margin: 12px 0 0; font-size: 16px; line-height: 1.6; }
.guide ul { padding-left: 20px; }
.guide li { margin-bottom: 8px; }
.guide .table-wrap { margin: 6px 0 18px; }
.guide td:first-child { white-space: normal; }
.cite { margin-left: 4px; font-size: 12px; font-weight: 400; color: var(--muted); white-space: nowrap; }
.pager { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 14px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
@media (max-width: 820px) {
  .sidebar { position: static; width: auto; border-right: 0; border-bottom: 1px solid var(--border); }
  .nav { max-height: 38vh; }
  .main { margin-left: 0; }
  .doc { padding: 28px 16px 72px; }
  h1 { font-size: 26px; }
  .ov-rel { margin-left: 0; flex-basis: 100%; }
}
@media (max-width: 640px) {
  .fields, .fields tbody, .fields tr, .fields td { display: block; width: auto; }
  .fields thead, .fields colgroup { display: none; }
  .fields tr { padding: 12px 14px; border-top: 1px solid var(--border); }
  .fields tbody tr:first-child { border-top: 0; }
  .fields td { padding: 0; border: 0; margin-top: 4px; }
  .fields td:first-child { margin-top: 0; }
  .fields td[data-label]:not(:first-child)::before {
    content: attr(data-label); display: inline-block; min-width: 84px; font-size: 12.5px; font-weight: 500; color: var(--muted);
  }
  .fields td[data-label="Description"]:not(:first-child)::before { display: block; }
  .fields td[data-label="Type"] .note { margin-left: 84px; }
  .fields tr.match { background: var(--accent-soft); }
  .fields tr.match td { background: none; }
  .kv { grid-template-columns: 1fr; gap: 2px; }
  .kv dd { margin-bottom: 8px; }
  table.plain td, table.plain th { padding: 10px; }
}
</style>

","type":"string","required":true,"description":"The message text"},{"name":"from","type":"string","required":true,"description":"Sender identifier — format-agnostic (phone number, email, handle, etc.)"},{"name":"to","type":"array","required":false,"description":"Recipient identifiers — same format-agnostic shape as from","items":"string"}],"inherited":[],"displayHints":{"from":null,"values":{"body_field":"body"}},"mergePolicy":{"default":{"value":"last_writer_wins","from":null},"fields":[{"name":"body","value":"keep_both_copies","from":null}]},"versionPolicy":null,"extra":null},"core.note":{"kind":"type","key":"core.note","id":"core.note","label":"Note","description":"Text content you created.","version":0,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"core/note.json","group":"core","fields":[{"name":"body","type":"string","required":true,"description":"The note text"},{"name":"title","type":"string","required":false,"description":"Heading or title"},{"name":"language","type":"string","required":false,"description":"BCP 47 language code","format":"bcp47"},{"name":"notes","type":"string","required":false,"description":"Personal annotations"}],"inherited":[],"displayHints":{"from":null,"values":{"title_field":"title","body_field":"body"}},"mergePolicy":{"default":{"value":"last_writer_wins","from":null},"fields":[{"name":"body","value":"keep_both_copies","from":null},{"name":"notes","value":"keep_both_copies","from":null}]},"versionPolicy":null,"extra":null},"system.account_holder":{"kind":"type","key":"system.account_holder","id":"system.account_holder","label":"Account holder","description":"The graph handle for the person who owns this instance. Exactly one row, created at provisioning, so edges such as authored-by can name the account holder instead of a free-floating stand-in. It carries no profile fields: the profile endpoints remain the source of truth for username, name, bio and avatar, and mirroring them here would give the same facts two writers. Lifecycle is bounded to active/revoked. Has no tier — the curated/feed dimension does not apply.","version":0,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"core/system/account_holder.json","group":"other:system","fields":[],"inherited":[],"displayHints":null,"mergePolicy":null,"versionPolicy":null,"extra":null},"system.app":{"kind":"type","key":"system.app","id":"system.app","label":"App","description":"A registered app identity. Carries the human-readable identity (display name, homepage) for an app whose types live under `app.\u003cname>.\u003ctype>`. The wire layer does not require a `system.app` record to exist when a type under `app.\u003cname>.*` registers — these records are advisory metadata for surfacing in connected-apps UIs, not registration prerequisites. Has no tier and no lifecycle status; the row's existence is the activation signal.","version":0,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"core/system/app.json","group":"other:system","fields":[{"name":"name","type":"string","required":true,"description":"Stable identifier slug used in app.\u003cname>.\u003ctype> registrations"},{"name":"display_name","type":"string","required":false,"description":"Human-readable display name"},{"name":"homepage_url","type":"url","required":false,"description":"App marketing/landing page"},{"name":"publisher_handle","type":"string","required":false,"description":"Optional reference to the publishing entity's handle"}],"inherited":[],"displayHints":null,"mergePolicy":null,"versionPolicy":null,"extra":null},"system.connection":{"kind":"type","key":"system.connection","id":"system.connection","label":"Connection","description":"An approved relationship between this instance and something outside it. `kind` discriminates between variants: `app` (an OAuth client this user has authorized) and `connector` (a connector acting on this user's behalf, whatever its upstream). Lifecycle bounded to active | revoked. Has no tier.","version":0,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"core/system/connection.json","group":"other:system","fields":[{"name":"kind","type":"enum","required":true,"description":"Discriminator for connection variant","enum":["app","connector"]},{"name":"client_id","type":"string","required":false,"description":"OAuth client identifier (for kind: app)"},{"name":"scopes","type":"array","required":false,"description":"Granted scope strings","items":"string"},{"name":"status","type":"enum","required":true,"description":"Lifecycle status (universal across all kinds)","enum":["active","revoked"]},{"name":"granted_at","type":"datetime","required":true,"description":"When the grant was approved"},{"name":"last_used_at","type":"datetime","required":false,"description":"Most recent successful use of any token issued under this grant"},{"name":"revoked_at","type":"datetime","required":false,"description":"When the grant was revoked, if any"},{"name":"connector_id","type":"string","required":false,"description":"For kind: connector — id of the connector this connection belongs to"},{"name":"credential_id","type":"string","required":false,"description":"For kind: connector — id of the credential the connector authenticates its upstream with"},{"name":"configuration","type":"object","required":false,"description":"For kind: connector — the connector's own configuration, shaped by the connector"},{"name":"direction","type":"enum","required":false,"description":"For kind: connector — does this connector read from its upstream, write to it, or both","enum":["read","write","both"]},{"name":"mapping","type":"object","required":false,"description":"Per-connection user mapping: conditions on the incoming record choose the target type and fields are assigned onto its schema. Validated as a whole document rather than field by field; shape and semantics live with the shared mapping module, not this schema."}],"inherited":[],"displayHints":null,"mergePolicy":null,"versionPolicy":null,"extra":null},"system.device":{"kind":"type","key":"system.device","id":"system.device","label":"Device","description":"A connected device — phone, laptop, watch, sync agent. Surfaces a Devices list in the console; carries a name, kind, and last-active timestamp; revocable. Lifecycle is bounded to active/revoked. Has no tier — the curated/feed dimension does not apply.","version":0,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"core/system/device.json","group":"other:system","fields":[{"name":"name","type":"string","required":true,"description":"Display name (e.g. \"Work laptop\")"},{"name":"kind","type":"enum","required":true,"description":"Device class","enum":["phone","tablet","laptop","desktop","watch","sync-agent","other"]},{"name":"last_active_at","type":"datetime","required":false,"description":"Most recent activity timestamp"}],"inherited":[],"displayHints":null,"mergePolicy":null,"versionPolicy":null,"extra":null},"system.folder":{"kind":"type","key":"system.folder","id":"system.folder","label":"Folder","description":"A folder's settings, held here and shared by every machine bound to the folder; each machine chooses only the directory. The settings are written only through `/folders`: created, changed at a version, and revoked. Lifecycle bounded to active | revoked. Has no tier.","version":0,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"core/system/folder.json","group":"other:system","fields":[{"name":"title","type":"string","required":true,"description":"The folder's name"},{"name":"search","type":"object","required":false,"description":"Which items the folder holds. `types`: type identifiers, each with its subtypes; empty or absent holds every type the folder's key reads. `tier`: `library` or `feed`, the one tier the folder holds; absent is `library`. `state`: `active`, `archived` or both; absent is both. `filter`: an expression in the listing grammar's `filter`. `beneath`: an item id; the item and everything under it by `parent-of`."},{"name":"defaults","type":"object","required":false,"description":"What a new file takes where its frontmatter leaves a blank, never applied to an edit: `type`, `tier`, `properties`, `tags`, and `edges` as a map from edge type to item ids, each edge running from the new file to the item named except `parent-of`, which runs from the item named so the new file is its child; a folder whose search follows an edge gives every new file that edge."},{"name":"include","type":"array","required":false,"description":"Paths the folder takes, as gitignore patterns relative to its root; empty or absent takes every path. A dot-led path is taken only where a line names a dot-led name on its way, and no line reaches what the built-in lists name","items":"string"},{"name":"ignore","type":"array","required":false,"description":"Paths the folder leaves alone, as gitignore patterns relative to its root, winning over `include`; the built-in lists, of files a machine or an editor writes for itself and of secrets, apply whatever either list says","items":"string"},{"name":"first_placement","type":"object","required":false,"description":"Where a new item of a type made elsewhere first appears: a map from type identifier to a directory relative to the folder's root. Placement only; it never decides membership."},{"name":"removal_threshold","type":"object","required":false,"description":"When a removal pauses for confirmation: more than `files` files and more than `fraction` of the folder at once. Absent members are 10 and 0.25."},{"name":"revoked_at","type":"datetime","required":false,"description":"When the folder was revoked"}],"inherited":[],"displayHints":null,"mergePolicy":null,"versionPolicy":null,"extra":null},"system.webhook":{"kind":"type","key":"system.webhook","id":"system.webhook","label":"Webhook","description":"A registered webhook subscription. Surfaces a Webhooks list; carries URL, event filter, delivery history; editable. Lifecycle is bounded to active/revoked. Has no tier.","version":0,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"core/system/webhook.json","group":"other:system","fields":[{"name":"url","type":"url","required":true,"description":"Delivery URL"},{"name":"events","type":"array","required":true,"description":"Subscribed event family names","items":"string"},{"name":"type_filter","type":"string","required":false,"description":"Optional type-id filter narrowing deliveries"},{"name":"active","type":"boolean","required":false,"description":"Subscription enabled"}],"inherited":[],"displayHints":null,"mergePolicy":null,"versionPolicy":null,"extra":null},"core.task":{"kind":"type","key":"core.task","id":"core.task","label":"Task","description":"Something to be done.","version":0,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"core/task.json","group":"core","fields":[{"name":"title","type":"string","required":true,"description":"What needs doing"},{"name":"description","type":"string","required":false,"description":"Brief context"},{"name":"body","type":"string","required":false,"description":"Detailed description"},{"name":"due_at","type":"string","required":false,"description":"Deadline","format":"datetime"},{"name":"starts_at","type":"string","required":false,"description":"When to start","format":"datetime"},{"name":"completed_at","type":"string","required":false,"description":"When completed","format":"datetime"},{"name":"status","type":"string","required":false,"description":"Recommended values: pending, in_progress, completed, canceled"},{"name":"priority","type":"enum","required":false,"description":"Task priority","enum":["low","medium","high","urgent"]},{"name":"place","type":"string","required":false,"description":"Location"},{"name":"precision","type":"enum","required":false,"description":"Temporal precision","enum":["year","month","day","time"]},{"name":"url","type":"string","required":false,"description":"Related link","format":"url"},{"name":"notes","type":"string","required":false,"description":"Personal annotations"}],"inherited":[],"displayHints":{"from":null,"values":{"title_field":"title","body_field":"body"}},"mergePolicy":{"default":{"value":"last_writer_wins","from":null},"fields":[{"name":"body","value":"keep_both_copies","from":null},{"name":"notes","value":"keep_both_copies","from":null}]},"versionPolicy":null,"extra":null},"edge/about":{"kind":"edge","key":"edge/about","id":"about","label":"About","description":"Source item is about the target item. Topical connection between items across types.","cardinality":"many-to-many","cascade":"orphan","source":[{"kind":"any"}],"target":[{"kind":"any"}],"fields":[],"file":"core/edges/about.json","group":"edges","extra":null},"edge/attached-to":{"kind":"edge","key":"edge/attached-to","id":"attached-to","label":"Attached to","description":"Source is an attachment (a file or media item) belonging to the target. Many-to-many: a file may be attached to multiple hosts; a host may have multiple attachments. Deleting the host orphans the attachment (it may still be attached to other items). The attachment's own file writes the edge, saying what it was made for; where the attachment cannot carry frontmatter, such as an image, the host's file writes it under the reverse name, `has-attachment`.","cardinality":"many-to-many","cascade":"orphan","source":[{"kind":"any"}],"target":[{"kind":"any"}],"fields":[],"file":"core/edges/attached-to.json","group":"edges","extra":{"reverse_name":"has-attachment"}},"edge/authored-by":{"kind":"edge","key":"edge/authored-by","id":"authored-by","label":"Authored by","description":"Source was authored by the target (usually a core.entity.person).","cardinality":"many-to-many","cascade":"orphan","source":[{"kind":"any"}],"target":[{"kind":"any"}],"fields":[],"file":"core/edges/authored-by.json","group":"edges","extra":null},"edge/derived-from":{"kind":"edge","key":"edge/derived-from","id":"derived-from","label":"Derived from","description":"Source was produced from the target (imports, AI generation, transformations). Both items remain valid in parallel.","cardinality":"many-to-many","cascade":"orphan","source":[{"kind":"any"}],"target":[{"kind":"any"}],"fields":[],"file":"core/edges/derived-from.json","group":"edges","extra":null},"edge/in-collection":{"kind":"edge","key":"edge/in-collection","id":"in-collection","label":"In collection","description":"Source item is a member of the target container. The target may be any type declaring the `container` role — a collection, an ongoing series, an album, a publisher's own container type — rather than a fixed list of type names, so a connector writing its own vocabulary can express containment without the platform naming its types first. An item may belong to any number of containers, and a container holds any number of members. A container may not itself be a member: containment here is flat, and `parent-of` is what hierarchy is for. Deleting the container leaves its members in place. Carries position for ordering within the container.","cardinality":"many-to-many","cascade":"orphan","source":[{"kind":"any"}],"target":[{"kind":"role","role":"container","types":["core.media.album","core.media.series"]}],"fields":[{"name":"position","type":"number","required":false,"description":"Ordering within the collection (1-based)."}],"file":"core/edges/in-collection.json","group":"edges","extra":null},"edge/in-folder":{"kind":"edge","key":"edge/in-folder","id":"in-folder","label":"In folder","description":"Where an item's file sits in a folder: the source is the item, the target the folder's `system.folder`, and `path` the file's path relative to the folder's root. Placement only; a folder's search alone decides what it holds, and the edge is never written in a file's frontmatter. An item may sit in any number of folders. Revoking or removing the folder leaves its items in place, and a revoked folder takes no new placement.","cardinality":"many-to-many","cascade":"orphan","source":[{"kind":"any"}],"target":[{"kind":"type","id":"system.folder","exists":true,"hasChildren":false}],"fields":[{"name":"path","type":"string","required":false,"description":"The file's path relative to the folder's root, with `/` between names; required, and it may not climb out of the folder. The edge takes no other property."}],"file":"core/edges/in-folder.json","group":"edges","extra":null},"edge/in-thread":{"kind":"edge","key":"edge/in-thread","id":"in-thread","label":"In thread","description":"Source item is in the thread-target sequence. Each source is in at most one thread; the target is the thread item. Carries position for ordering.","cardinality":"many-to-one","cascade":"orphan","source":[{"kind":"any"}],"target":[{"kind":"any"}],"fields":[{"name":"position","type":"number","required":false,"description":"Ordering within the thread (1-based)."}],"file":"core/edges/in-thread.json","group":"edges","extra":null},"edge/parent-of":{"kind":"edge","key":"edge/parent-of","id":"parent-of","label":"Parent of","description":"Source is the parent of the target. Target has at most one parent. Deleting the parent cascades to children. A child's file writes the edge, naming its parent under the reverse name, `child-of`, so a parent's file does not list every child.","cardinality":"one-to-many","cascade":"cascade","source":[{"kind":"any"}],"target":[{"kind":"any"}],"fields":[],"file":"core/edges/parent-of.json","group":"edges","extra":{"reverse_name":"child-of","written_at":"target"}},"edge/references":{"kind":"edge","key":"edge/references","id":"references","label":"References","description":"Source explicitly references the target. Distinct from `about` (topical) and `derived-from` (provenance). Covers wikilink-style mentions and the highlight-on-a-book case.","cardinality":"many-to-many","cascade":"orphan","source":[{"kind":"any"}],"target":[{"kind":"any"}],"fields":[],"file":"core/edges/references.json","group":"edges","extra":null},"edge/supersedes":{"kind":"edge","key":"edge/supersedes","id":"supersedes","label":"Supersedes","description":"Source replaces the target as the current version. Linear chain; no cycles. Deleting the head does not promote the predecessor (orphan).","cardinality":"one-to-one","cascade":"orphan","source":[{"kind":"any"}],"target":[{"kind":"any"}],"fields":[],"file":"core/edges/supersedes.json","group":"edges","extra":null},"guide/core-types":{"kind":"guide","key":"guide/core-types","id":"guide/core-types","group":"guide","label":"Core types","description":"What an item is, what a type declares about it, and the rules every shipped type keeps.","fields":[],"next":"guide/custom-types","blocks":[["h2","Items"],["p","An item is one record. Beside its `id` and `source`, it carries these parts. A type declares fields; an item carries properties, the values those fields govern. {{items.md 1}} {{GLOSSARY.md, property}}"],["table",["Part","What it holds"],[["`type`","What the item is, such as `core.note`."],["`properties`","The values the type validates; a missing or invalid one is refused `400 invalid_properties`. {{items.md 14}}"],["`state`","Its lifecycle: `active`, `archived` or `trashed`, or `revoked` on a `system.*` item. {{items.md 25}}"],["`tier`","Its layer: `library` unless told `feed`. A `system.*` item has none. {{items.md 7}}"],["`occurred_at`","The item's own time, stored as sent; `created_at` when omitted. {{items.md 6}}"],["`version`","Starts at 1 and rises by one per update, which names the version it read. {{versions.md 1, 2, 6}}"]]],["h2","What a type declares"],["p","A type is a definition with an identifier, a label, a description, a `version` and a map of fields, each with a type and a description. Around the fields sit these declarations."],["table",["Declaration","What it does"],[["`required`","The fields every item of the type must carry. {{items.md 14}}"],["`display_hints`","The title field and the body field, so a reader with no code for the type can still show it."],["`merge_policy`","How concurrent edits settle, per field and by default: `last_writer_wins`, or `keep_both_copies`, which writes the losing value to a sibling item. {{types.md 12}} {{versions.md 13}}"],["`searchable`","Set to false, keeps a field out of full-text search; the value stays readable. {{types.md 15}}"]]],["h2","Reserved roots"],["p","Three roots belong to the platform: `core`, `system` and `marfa`. No key can register under them, not even the broadest credential, because the reservation is a property of the build rather than of the request. The refusal is `403 forbidden`, naming the root. The check is on the whole first segment, so `core-pub.deal` is an ordinary type. {{types.md 2}}"],["table",["Root","In this build","Holds"],[["`core`","21 types","The shared vocabulary: notes, tasks, events, media, entities, files."],["`system`","6 types","What the server records about itself. No key can write one. {{items.md 16}}"],["`marfa`","0 types","Source types for Marfa's own connectors."]]],["h2","Inheritance"],["p","A type may name a `parent`. It then carries the parent's fields beside its own, and its items accept the parent's properties. It may add fields and restate an inherited one unchanged, but changing an inherited field's shape is refused `400 inheritance_violation`, from either side: a parent cannot gain a field a child already declares with another shape. {{types.md 8}}"],["p","A listing by a parent returns its subtypes' items too, and a listing by the subtype only its own: `core.entity` returns people and places, `core.entity.person` returns people. {{types.md 9, 23}} The merge policy resolves through the same chain, a child's entries layering over its parent's. {{types.md 12}}"],["h2","Versions and immutability"],["p","A registered type changes through `PUT /types/{id}`, a versioned replacement: adding a field needs a version bump, removing one without a bump is refused `422 version_bump_mismatch`, and a descriptive change may keep its number. {{types.md 13}}"],["p","A shipped type cannot be changed that way: replacing or deleting one is refused `403 core_type_immutable`. {{types.md 13, 14}} It changes only when a new build ships it at a higher version. So the build an instance runs, not whoever holds a key, settles what a shipped type means, and its description is held to its sentences like anything else the server publishes about itself. {{types.md 2, 24}}"]],"headings":["Items","What a type declares","Reserved roots","Inheritance","Versions and immutability"]},"guide/custom-types":{"kind":"guide","key":"guide/custom-types","id":"guide/custom-types","group":"guide","label":"Custom Types","description":"Naming and registering your own types, how they relate to the core types, and the levers an instance holds over them.","fields":[],"previous":"guide/core-types","blocks":[["h2","Identifiers"],["p","A type identifier is two or more lowercase segments joined by dots, each of letters, digits, hyphens and underscores, at most 128 characters. A malformed identifier answers `400 validation_error`; a well-formed one nothing has registered answers `400 unknown_type`. {{types.md 1}}"],["table",["Identifier","Answer"],[["`acme.deal`","Well formed: under the publisher handle `acme`."],["`user.recipe`","Well formed: a user type."],["`app.example.bookmark`","Well formed: an app type, with two segments after `app`."],["`app.bookmark`","Refused: one segment after `app`."],["`bookmark`, `Core.Bookmark`","Refused: one segment, or an uppercase letter."],["`core.recipe`","Well formed, refused `403 forbidden`: a reserved root. {{types.md 2}}"]]],["p","Twelve more roots fail the grammar, because a type under them could be written and never granted: the permission roots `schema`, `keys`, `items`, `webhooks`, `config`, `audit` and `grants`; the scope roots `content`, `metadata`, `edge` and `profile`; and `space`. None can be a publisher handle. {{types.md 1}} {{GLOSSARY.md, Permissions}}"],["h2","Registering"],["p","`POST /types` with an `id` and `fields` answers `201`; the type then lists, reads and validates items. {{types.md 3}} Registering takes `metadata.types:write`; replacing or deleting takes `schema.write`. {{types.md 4, 13, 14}} A field named like a first-class item field, such as `type`, is refused `400 property_shadows_field`. {{types.md 5}}"],["h2","Parent or `compatible_with`"],["p","`parent` says is-a: the type is a kind of its parent, inherits its fields and appears in the parent's listings. `compatible_with` says reads-as: the type declares its own fields in full and claims every required field of the target, with the same shape, so a reader of the target can read it. The claim is checked at registration: `422 compatible_with_violation`. {{types.md 8, 9, 10}}"],["table",["","`parent`","`compatible_with`"],[["Says","is a kind of","can be read as"],["Fields","inherited","declared in full"],["Use it when","your type refines a core type and belongs beside it","your type keeps an outside source's own shape"]]],["p","No connector type in this build declares a compatibility."],["h2","Connector types"],["p","A connector writes items like any other key, under its key's source. {{items.md 4}} Two patterns are legitimate."],["ul",["Write a core type directly. The item lands in the library, readable by everything, trading fidelity for interoperability, in the words of `marfa.podcast.show`.","Write a source-fidelity type into the feed and promote it. Promoting makes a core-typed library copy that points back with a `derived-from` edge; the feed item stays as it came. The connector type must be readable as a core type, by `parent` or `compatible_with`. {{GLOSSARY.md, promote}}"]],["h2","Tiers and states"],["p","`library` holds what a person chose to keep, in a core type or a child of one; `feed` holds what arrives in volume, as it came, until promoted or archived. A create lands in the library unless the body or the key's `default_tier` says feed. {{items.md 7}} {{GLOSSARY.md, tier}}"],["p","Every canonical type, custom ones included, moves items between `active`, `archived` and `trashed` along one graph; `revoked` belongs to `system.*` types alone and is final. {{items.md 25}} {{types.md 11}}"],["h2","Enforcement levers"],["p","Three levers sit in the instance configuration, read and replaced with `config.manage`. {{types.md 16}}"],["table",["Lever","Effect"],[["Strict mode, `enforcement.strict_mode.types`","Refuses undeclared properties on the named types, `400 invalid_properties`. Off by default. {{types.md 17}}"],["Source allowlist, `enforcement.source_allowlist`","Refuses creates on the named types from unlisted sources, `403 forbidden`. {{types.md 18}}"],["Source filter, `enforcement.source_filter`","Narrows every read that returns a set to the listed sources, never a read by id. {{types.md 19}}"]]]],"headings":["Identifiers","Registering","Parent or `compatible_with`","Connector types","Tiers and states","Enforcement levers"]}},"failures":[]}</script>

(function () {
  'use strict';

  var DATA = JSON.parse(document.getElementById('marfa-data').textContent);
  var ITEMS = DATA.items;
  var GROUPS = {};
  DATA.groups.forEach(function (g) { GROUPS[g.key] = g; });

  var nav = document.getElementById('nav');
  var main = document.getElementById('main');
  var search = document.getElementById('search');
  var query = '';

  // Which groups are closed: kept for the browser session. During a search the
  // groups with matches open, and a click only closes one for that search.
  var STORE = 'marfa-types.closed-groups';
  var closed = {};
  try { closed = JSON.parse(sessionStorage.getItem(STORE) || '{}') || {}; } catch (e) { closed = {}; }
  var closedWhileSearching = {};
  function saveClosed() {
    try { sessionStorage.setItem(STORE, JSON.stringify(closed)); } catch (e) { /* in-memory only */ }
  }

  // Helpers

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function hrefFor(key) {
    return '#' + key.replace(/[^A-Za-z0-9._\-\/:]/g, encodeURIComponent);
  }
  function link(key, text) {
    var item = ITEMS[key];
    if (!item) return '<span class="ident">' + esc(text) + '</span>';
    return '<a class="ident" href="' + hrefFor(key) + '" title="' + esc(item.label) + '">' + esc(text) + '</a>';
  }
  function typeLink(id) { return link(id, id); }
  function list(parts) { return parts.join(', '); }
  function joinAnd(parts) {
    if (parts.length < 2) return parts.join('');
    return parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1];
  }
  function orList(parts) {
    if (parts.length < 2) return parts.join('');
    return parts.slice(0, -1).join(', ') + ' or ' + parts[parts.length - 1];
  }
  function humanise(s) {
    s = String(s).replace(/_/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2').toLowerCase();
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  // Long identifiers may wrap after an underscore or a dot, never mid-word.
  function breakable(s) { return esc(s).replace(/([_.])/g, '$1<wbr>'); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function firstSentence(s) {
    var m = /^[\s\S]*?[.!?](?=\s+[A-Z(`"]|$)/.exec(s || '');
    return m ? m[0] : (s || '');
  }

  // Prose: backticked spans become identifiers, dotted type ids link to their type,
  // and {{chapter n}} becomes a small citation.
  var DOTTED = /[A-Za-z][A-Za-z0-9_]*(?:\.[A-Za-z0-9_]+)+/g;
  var CITE = /\{\{(.+?)\}\}/g;
  function linkIds(text, links) {
    if (!links) return esc(text);
    var out = '', last = 0, m;
    DOTTED.lastIndex = 0;
    while ((m = DOTTED.exec(text))) {
      if (ITEMS[m[0]] && ITEMS[m[0]].kind === 'type') {
        out += esc(text.slice(last, m.index)) + typeLink(m[0]);
        last = m.index + m[0].length;
      }
    }
    return out + esc(text.slice(last));
  }
  function prose(text, links) {
    var out = '', last = 0, m;
    CITE.lastIndex = 0;
    while ((m = CITE.exec(text))) {
      out += linkIds(text.slice(last, m.index), links) + '<span class="cite">' + esc(m[1]) + '</span>';
      last = m.index + m[0].length;
    }
    return out + linkIds(text.slice(last), links);
  }
  function ident(s, links) {
    if (links && ITEMS[s] && ITEMS[s].kind === 'type') return typeLink(s);
    if (links && ITEMS['edge/' + s]) return link('edge/' + s, s);
    return '<span class="ident">' + esc(s) + '</span>';
  }
  function inline(text, links) {
    if (!text) return '';
    var parts = String(text).split('`');
    var out = '';
    for (var i = 0; i < parts.length; i++) {
      var closedSpan = i % 2 === 1 && i < parts.length - 1;
      if (closedSpan) out += ident(parts[i], links);
      else out += (i % 2 === 1 ? '`' : '') + prose(parts[i], links);
    }
    return out;
  }

  // Search: id, label, description and field names; a guide page by its title and headings.

  function tokens() {
    return query.toLowerCase().split(/\s+/).filter(Boolean);
  }
  function haystack(item) {
    if (!item._hay) {
      item._hay = [item.id, item.label, item.description].concat(item.headings || []).join(' ').toLowerCase();
    }
    return item._hay;
  }
  function matchItem(item, toks) {
    if (!toks.length) return { ok: true, fields: [] };
    var hay = haystack(item);
    var names = (item.fields || []).map(function (f) { return f.name; });
    var ok = toks.every(function (t) {
      return hay.indexOf(t) !== -1 || names.some(function (n) { return n.toLowerCase().indexOf(t) !== -1; });
    });
    var fields = ok ? names.filter(function (n) {
      return toks.some(function (t) { return n.toLowerCase().indexOf(t) !== -1; });
    }) : [];
    return { ok: ok, fields: fields };
  }
  function fieldMatches(name) {
    var toks = tokens();
    if (!toks.length) return false;
    name = name.toLowerCase();
    return toks.some(function (t) { return name.indexOf(t) !== -1; });
  }
  function visibleKeys() {
    var toks = tokens(), keys = [];
    DATA.groups.forEach(function (g) {
      g.items.forEach(function (k) { if (matchItem(ITEMS[k], toks).ok) keys.push(k); });
    });
    return keys;
  }

  // Sidebar

  function buildNav() {
    var html = '<a class="nav-item nav-top" href="#" data-home data-key="" id="nav-overview">Overview</a>';
    DATA.groups.forEach(function (g) {
      var id = 'group-' + g.key.replace(/[^A-Za-z0-9]/g, '-');
      html += '<div class="group" data-group="' + esc(g.key) + '">' +
        '<button type="button" class="group-title" aria-expanded="true" aria-controls="' + id + '">' +
        '<span class="gt-name">' + esc(g.title) + '</span><span class="gt-count">' + g.items.length + '</span>' +
        '<span class="chev" aria-hidden="true"></span></button><div class="group-items" id="' + id + '">';
      g.items.forEach(function (k) {
        var item = ITEMS[k];
        var depth = g.depth[k] || 0;
        html += '<a class="nav-item" href="' + hrefFor(k) + '" data-key="' + esc(k) + '"' +
          (item.kind === 'guide' ? '' : ' title="' + esc(item.id) + '"') +
          ' style="padding-left:' + (10 + depth * 14) + 'px">' + esc(item.label) + '</a>';
      });
      html += '</div></div>';
    });
    html += '<p class="nav-empty" id="nav-empty" hidden>No matches.</p>';
    nav.innerHTML = html;
    nav.querySelectorAll('.group-title').forEach(function (button) {
      button.addEventListener('click', function () {
        var key = button.parentNode.getAttribute('data-group');
        if (tokens().length) {
          closedWhileSearching[key] = !closedWhileSearching[key];
        } else {
          closed[key] = !closed[key];
          saveClosed();
        }
        updateNav();
      });
    });
  }
  function updateNav() {
    var toks = tokens(), searching = toks.length > 0, any = false;
    nav.querySelectorAll('.group').forEach(function (group) {
      var key = group.getAttribute('data-group'), shown = 0;
      group.querySelectorAll('.nav-item').forEach(function (a) {
        var ok = matchItem(ITEMS[a.getAttribute('data-key')], toks).ok;
        a.hidden = !ok;
        if (ok) shown++;
      });
      var total = GROUPS[key].items.length;
      var open = searching ? !closedWhileSearching[key] : !closed[key];
      group.hidden = searching && shown === 0;
      group.classList.toggle('closed', !open);
      group.querySelector('.group-title').setAttribute('aria-expanded', open ? 'true' : 'false');
      group.querySelector('.group-items').hidden = !open;
      group.querySelector('.gt-count').textContent = searching ? shown + ' of ' + total : total;
      if (shown) any = true;
    });
    document.getElementById('nav-empty').hidden = any || !searching;
  }
  function markActive(key) {
    var active = null;
    nav.querySelectorAll('.nav-item').forEach(function (a) {
      var on = key !== null && a.getAttribute('data-key') === key;
      a.classList.toggle('active', on);
      if (on) { a.setAttribute('aria-current', 'page'); active = a; }
      else a.removeAttribute('aria-current');
    });
    if (!active) return;
    var group = active.closest('.group');
    if (group && !tokens().length) {
      var gk = group.getAttribute('data-group');
      if (closed[gk]) { closed[gk] = false; saveClosed(); updateNav(); }
    }
    if (active.offsetParent === null) return;
    var r = active.getBoundingClientRect(), n = nav.getBoundingClientRect();
    if (r.top < n.top || r.bottom > n.bottom) nav.scrollTop += r.top - n.top - nav.clientHeight / 3;
  }

  // Pieces of a type page

  function typeCell(f) {
    var t = f.type || 'unknown', fmt = f.format || null;
    if (t === 'string' && fmt && ['url', 'email', 'datetime', 'date', 'thumbnail'].indexOf(fmt) !== -1) {
      t = fmt; fmt = null;
    } else if (fmt === t) {
      fmt = null;
    }
    var notes = [];
    if (f.enum && f.enum.length) {
      notes.push('One of ' + orList(f.enum.map(function (v) { return '<span class="val">' + esc(v) + '</span>'; })));
    }
    if (t === 'array') {
      var itemWords = { string: 'strings', object: 'objects', number: 'numbers', integer: 'integers',
        boolean: 'true or false values', url: 'URLs', email: 'email addresses', date: 'dates',
        datetime: 'dates and times', enum: 'enum values' };
      notes.push(f.items ? 'List of ' + esc(itemWords[f.items] || f.items + ' values') : 'List');
    }
    if (fmt) {
      var formatWords = { bcp47: 'BCP 47 language tag', iso3166: 'ISO 3166 country code' };
      notes.push(esc(formatWords[fmt] || 'Format ' + fmt));
    }
    if (f.maxItems != null) notes.push('At most ' + esc(f.maxItems) + ' items');
    if (f.maxLength != null) notes.push('At most ' + esc(f.maxLength) + ' characters');
    if (f.searchable === false) notes.push('Not indexed for search');
    if (f.extra) {
      Object.keys(f.extra).forEach(function (k) {
        notes.push(esc(humanise(k)) + ': ' + esc(JSON.stringify(f.extra[k])));
      });
    }
    return '<span class="type">' + esc(t) + '</span>' +
      notes.map(function (n) { return '<span class="note">' + n + '</span>'; }).join('');
  }
  function fieldsTable(fields) {
    var rows = fields.map(function (f) {
      var refines = f.refines ? '<span class="note">Refines ' + typeLink(f.refines) + '</span>' : '';
      return '<tr' + (fieldMatches(f.name) ? ' class="match"' : '') + '>' +
        '<td data-label="Field"><span class="fname">' + breakable(f.name) + '</span>' + refines + '</td>' +
        '<td data-label="Type">' + typeCell(f) + '</td>' +
        '<td data-label="Required">' + (f.required ? '<span class="req">Yes</span>' : '<span class="opt">No</span>') + '</td>' +
        '<td data-label="Description">' + inline(f.description, true) + '</td>' +
        '</tr>';
    }).join('');
    return '<div class="table-wrap"><table class="fields">' +
      '<colgroup><col class="c-field"><col class="c-type"><col class="c-req"><col></colgroup>' +
      '<thead><tr><th scope="col">Field</th><th scope="col">Type</th><th scope="col">Required</th><th scope="col">Description</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
  }
  function fact(label, value) {
    return value ? '<div><dt>' + esc(label) + '</dt><dd>' + value + '</dd></div>' : '';
  }
  function kv(rows) {
    return '<dl class="kv">' + rows.join('') + '</dl>';
  }
  function kvRow(term, value) {
    return '<dt>' + term + '</dt><dd>' + value + '</dd>';
  }
  function inheritedNote(from) {
    return from ? '<p class="section-note">Inherited from ' + typeLink(from) + '</p>' : '';
  }
  function header(item) {
    return '<h1>' + esc(item.label) + '</h1>' +
      '<p class="type-id">' + esc(item.id) + '</p>' +
      (item.description ? '<p class="desc">' + inline(item.description, true) + '</p>' : '');
  }
  function extraSection(extra) {
    if (!extra) return '';
    return '<section><h2>Other properties</h2>' + kv(Object.keys(extra).map(function (k) {
      var v = extra[k];
      return kvRow(esc(humanise(k)), esc(typeof v === 'string' ? v : JSON.stringify(v)));
    })) + '</section>';
  }

  function renderType(t) {
    var parent = '';
    if (t.parent) {
      parent = ITEMS[t.parent] ? typeLink(t.parent) : '<span class="ident">' + esc(t.parent) + '</span> <span class="muted">(not found)</span>';
    }
    var roles = t.roles.map(function (r) {
      return esc(r.role) + (r.from ? ' <span class="muted">from</span> ' + typeLink(r.from) : '');
    });
    var facts = '<dl class="facts">' +
      fact('Version', t.version != null ? esc(t.version) : '') +
      fact('Parent', parent) +
      fact('Children', list(t.children.map(typeLink))) +
      fact('Compatible with', list(t.compatibleWith.map(typeLink))) +
      fact('Declared compatible by', list(t.compatibleFrom.map(typeLink))) +
      fact('Roles', list(roles)) +
      fact('File', esc(t.file)) +
      '</dl>';

    var html = '<article class="doc">' + header(t) + facts;

    html += '<section><h2>Fields <span class="count">' + t.fields.length + '</span></h2>' +
      (t.fields.length ? fieldsTable(t.fields) : '<p class="empty">No fields of its own.</p>') + '</section>';

    if (t.inherited.length) {
      var total = t.inherited.reduce(function (n, g) { return n + g.fields.length; }, 0);
      html += '<section><h2>Inherited fields <span class="count">' + total + '</span></h2>';
      t.inherited.forEach(function (g) {
        var from = ITEMS[g.from];
        html += '<h3>From ' + link(g.from, from ? from.label : g.from) + '<span class="muted">' + esc(g.from) + '</span></h3>' +
          fieldsTable(g.fields);
      });
      html += '</section>';
    }

    if (t.displayHints) {
      var hints = t.displayHints.values;
      html += '<section><h2>Display hints</h2>' + inheritedNote(t.displayHints.from) +
        kv(Object.keys(hints).map(function (k) {
          var v = hints[k];
          return kvRow(esc(humanise(k)), typeof v === 'string' ? '<span class="ident">' + esc(v) + '</span>' : esc(JSON.stringify(v)));
        })) + '</section>';
    }

    if (t.mergePolicy) {
      var mp = t.mergePolicy;
      var sources = [];
      if (mp.default) sources.push(mp.default.from);
      mp.fields.forEach(function (f) { sources.push(f.from); });
      var single = sources.every(function (s) { return s === sources[0]; });
      var from = function (s) { return !single && s ? ' <span class="muted">from</span> ' + typeLink(s) : ''; };
      var rows = [];
      if (mp.default) rows.push(kvRow('Default', esc(humanise(mp.default.value)) + from(mp.default.from)));
      if (mp.fields.length) {
        rows.push('<dt class="sub">Per field</dt>');
        mp.fields.forEach(function (f) {
          rows.push(kvRow('<span class="ident">' + esc(f.name) + '</span>', esc(humanise(f.value)) + from(f.from)));
        });
      }
      html += '<section><h2>Merge policy</h2>' + (single ? inheritedNote(sources[0]) : '') + kv(rows) + '</section>';
    }

    if (t.versionPolicy) {
      html += '<section><h2>Version policy</h2>' + kv(Object.keys(t.versionPolicy).map(function (k) {
        return kvRow(esc(humanise(k)), esc(JSON.stringify(t.versionPolicy[k])));
      })) + '</section>';
    }

    html += extraSection(t.extra);
    return html + '</article>';
  }

  function constraint(c) {
    if (c.kind === 'any') return 'Any type';
    if (c.kind === 'role') {
      var members = c.types.length ? ': ' + list(c.types.map(typeLink)) : ' <span class="muted">(none at present)</span>';
      return 'Any type with the <span class="ident">' + esc(c.role) + '</span> role' + members;
    }
    var name = c.exists ? typeLink(c.id) : '<span class="ident">' + esc(c.id) + '</span> <span class="muted">(not found)</span>';
    return name + (c.hasChildren ? ' <span class="muted">and its subtypes</span>' : '');
  }
  function cardinality(e) {
    return e.cardinality ? humanise(String(e.cardinality).replace(/-/g, ' ')) : '';
  }

  function renderEdge(e) {
    var facts = '<dl class="facts">' +
      fact('Cardinality', esc(cardinality(e))) +
      fact('On delete', e.cascade ? esc(humanise(e.cascade)) : '') +
      fact('File', esc(e.file)) +
      '</dl>';
    var html = '<article class="doc">' + header(e) + facts;
    html += '<section><h2>Endpoints</h2>' + kv([
      kvRow('Source', e.source.length ? e.source.map(constraint).join('<br>') : '<span class="muted">Not stated</span>'),
      kvRow('Target', e.target.length ? e.target.map(constraint).join('<br>') : '<span class="muted">Not stated</span>')
    ]) + '</section>';
    html += '<section><h2>Properties <span class="count">' + e.fields.length + '</span></h2>' +
      (e.fields.length ? fieldsTable(e.fields) : '<p class="empty">No properties.</p>') + '</section>';
    html += extraSection(e.extra);
    return html + '</article>';
  }

  function renderGuide(g) {
    var html = '<article class="doc guide"><h1>' + esc(g.label) + '</h1>' +
      (g.description ? '<p class="lede">' + inline(g.description, true) + '</p>' : '');
    g.blocks.forEach(function (b) {
      if (b[0] === 'h2') {
        html += '<h2>' + inline(b[1], false) + '</h2>';
      } else if (b[0] === 'p') {
        html += '<p>' + inline(b[1], true) + '</p>';
      } else if (b[0] === 'ul') {
        html += '<ul>' + b[1].map(function (li) { return '<li>' + inline(li, true) + '</li>'; }).join('') + '</ul>';
      } else if (b[0] === 'table') {
        html += '<div class="table-wrap"><table class="plain"><thead><tr>' +
          b[1].map(function (h) { return '<th scope="col">' + inline(h, false) + '</th>'; }).join('') +
          '</tr></thead><tbody>' +
          b[2].map(function (row) {
            return '<tr>' + row.map(function (c) { return '<td>' + inline(c, true) + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table></div>';
      }
    });
    if (g.next && ITEMS[g.next]) html += '<p class="pager">Next: ' + link(g.next, ITEMS[g.next].label) + '</p>';
    if (g.previous && ITEMS[g.previous]) html += '<p class="pager">Previous: ' + link(g.previous, ITEMS[g.previous].label) + '</p>';
    return html + '</article>';
  }

  // Overview and search results

  function relation(item) {
    if (item.kind === 'edge') return esc(cardinality(item));
    if (item.kind !== 'type' || !/^connector:/.test(item.group)) return '';
    var parts = [];
    if (item.parent) parts.push('Inherits from ' + typeLink(item.parent));
    if (item.compatibleWith.length) parts.push('Compatible with ' + list(item.compatibleWith.map(typeLink)));
    return parts.length ? parts.join('; ') : 'Stands alone';
  }
  function row(item, extra) {
    var rel = relation(item);
    return '<div class="ov-row"><div class="ov-head">' +
      '<a class="ov-label" href="' + hrefFor(item.key) + '">' + esc(item.label) + '</a>' +
      (item.kind === 'guide' ? '' : '<span class="ov-id">' + esc(item.id) + '</span>') +
      (rel ? '<span class="ov-rel">' + rel + '</span>' : '') + '</div>' +
      (item.description ? '<p class="ov-desc">' + inline(firstSentence(item.description), true) + '</p>' : '') +
      (extra || '') + '</div>';
  }
  function tree(g) {
    var inGroup = {}, seen = {};
    g.items.forEach(function (k) { inGroup[k] = true; });
    function node(k) {
      if (seen[k]) return '';
      seen[k] = true;
      var item = ITEMS[k];
      var kids = (item.children || []).filter(function (c) { return inGroup[c]; });
      return '<li>' + row(item) +
        (kids.length ? '<ul class="tree">' + kids.map(node).join('') + '</ul>' : '') + '</li>';
    }
    var roots = g.items.filter(function (k) { return !(g.depth[k] > 0); });
    return '<ul class="tree">' + roots.map(node).join('') + '</ul>';
  }

  function renderOverview() {
    var core = 0, connectors = 0, publishers = 0, edges = 0, others = [];
    DATA.groups.forEach(function (g) {
      var n = g.items.length, name = g.title.toLowerCase();
      if (g.key === 'core') core = n;
      else if (/^connector:/.test(g.key)) { connectors += n; publishers++; }
      else if (g.key === 'edges') edges = n;
      else if (g.key !== 'guide') others.push(plural(n, name + ' type', name + ' types'));
    });
    var parts = [plural(core, 'core type', 'core types')];
    if (connectors) parts.push(plural(connectors, 'connector type', 'connector types') + ' from ' + plural(publishers, 'publisher', 'publishers'));
    parts = parts.concat(others);
    var guide = GROUPS.guide ? GROUPS.guide.items : [];

    var html = '<article class="doc"><h1>Marfa types</h1>' +
      '<p class="lede">This build defines ' + joinAnd(parts) + ', related by ' + plural(edges, 'edge type', 'edge types') +
      '. Read from packages/types on ' + esc(DATA.generated) + '.</p>';
    if (guide.length) {
      html += '<p class="lede">New to the model? Start with ' +
        guide.map(function (k) { return link(k, ITEMS[k].label); }).join(', then ') + '.</p>';
    }
    if (DATA.failures.length) {
      html += '<div class="failures">' + plural(DATA.failures.length, 'file', 'files') + ' could not be used:<ul>' +
        DATA.failures.map(function (f) { return '<li><span class="ident">' + esc(f.file) + '</span> ' + esc(f.error) + '</li>'; }).join('') +
        '</ul></div>';
    }
    DATA.groups.forEach(function (g) {
      if (g.key === 'guide') return;
      html += '<section class="ov-group"><h2>' + esc(g.title) + '<span class="count">' + g.items.length + '</span></h2>' +
        tree(g) + '</section>';
    });
    return html + '</article>';
  }

  function renderResults() {
    var toks = tokens(), found = 0, sections = '';
    DATA.groups.forEach(function (g) {
      var rows = '';
      g.items.forEach(function (k) {
        var item = ITEMS[k], m = matchItem(item, toks);
        if (!m.ok) return;
        found++;
        var extra = m.fields.length ? '<p class="ov-fields">' + (item.kind === 'edge' ? 'Properties: ' : 'Fields: ') +
          m.fields.map(function (n) { return '<span class="ident">' + esc(n) + '</span>'; }).join(', ') + '</p>' : '';
        rows += '<li>' + row(item, extra) + '</li>';
      });
      if (rows) sections += '<section class="ov-group"><h2>' + esc(g.title) + '</h2><ul class="tree">' + rows + '</ul></section>';
    });
    var q = '‘' + esc(query.trim()) + '’';
    return '<article class="doc"><h1>Search</h1><p class="lede">' +
      (found ? plural(found, 'match', 'matches') + ' for ' + q + '.' : 'Nothing matches ' + q + '.') +
      '</p>' + sections + '</article>';
  }

  function renderMissing(key) {
    return '<article class="doc"><h1>Not found</h1><p class="lede">There is no page called <span class="ident">' +
      esc(key) + '</span>. <a href="#">Go to the overview</a>.</p></article>';
  }

  // Routing

  function currentKey() {
    var raw = location.hash.slice(1);
    try { return decodeURIComponent(raw); } catch (e) { return raw; }
  }
  function render() {
    var key = currentKey();
    var item = key ? ITEMS[key] : null;
    if (!key) {
      var searching = tokens().length > 0;
      main.innerHTML = searching ? renderResults() : renderOverview();
      document.title = searching ? 'Search | Marfa types' : 'Marfa types';
      markActive(searching ? null : '');
      return;
    }
    if (!item) {
      main.innerHTML = renderMissing(key);
      document.title = 'Not found | Marfa types';
      markActive(null);
      return;
    }
    if (item.kind === 'guide') {
      main.innerHTML = renderGuide(item);
      document.title = item.label + ' | Marfa types';
    } else {
      main.innerHTML = item.kind === 'edge' ? renderEdge(item) : renderType(item);
      document.title = item.label + ' (' + item.id + ') | Marfa types';
    }
    markActive(key);
  }

  function onQuery() {
    query = search.value;
    closedWhileSearching = {};
    updateNav();
    if (currentKey() && query.trim()) location.hash = '';
    else render();
  }
  function goHome() {
    if (search.value) { search.value = ''; query = ''; closedWhileSearching = {}; updateNav(); }
    if (!currentKey()) render();
  }

  search.addEventListener('input', onQuery);
  search.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var first = visibleKeys()[0];
      if (first) location.hash = hrefFor(first);
    } else if (e.key === 'Escape' && search.value) {
      search.value = '';
      onQuery();
    }
  });
  document.addEventListener('keydown', function (e) {
    var typing = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if ((e.key === '/' && !typing) || (e.key === 'k' && (e.metaKey || e.ctrlKey))) {
      e.preventDefault();
      search.focus();
      search.select();
    }
  });
  document.addEventListener('click', function (e) {
    var home = e.target.closest && e.target.closest('[data-home]');
    if (home) goHome();
  });
  window.addEventListener('hashchange', function () {
    render();
    window.scrollTo(0, 0);
  });

  buildNav();
  updateNav();
  render();
})();
</script>
</body>
</html>
