-many","cascade":"orphan","source":[{"kind":"any"}],"target":[{"kind":"any"}],"fields":[],"file":"core/edges/authored-by.json","group":"edges","extra":null},"edge/derived-from":{"kind":"edge","key":"edge/derived-from","id":"derived-from","label":"Derived from","description":"Source was produced from the target (imports, AI generation, transformations). Both items remain valid in parallel.","cardinality":"many-to-many","cascade":"orphan","source":[{"kind":"any"}],"target":[{"kind":"any"}],"fields":[],"file":"core/edges/derived-from.json","group":"edges","extra":null},"edge/in-collection":{"kind":"edge","key":"edge/in-collection","id":"in-collection","label":"In collection","description":"Source item is a member of the target container. The target may be any type declaring the `container` role — a collection, an ongoing series, an album, a publisher's own container type — rather than a fixed list of type names, so a connector writing its own vocabulary can express containment without the platform naming its types first. An item may belong to any number of containers, and a container holds any number of members. A container may not itself be a member: containment here is flat, and `parent-of` is what hierarchy is for. Deleting the container leaves its members in place. Carries position for ordering within the container.","cardinality":"many-to-many","cascade":"orphan","source":[{"kind":"any"}],"target":[{"kind":"role","role":"container","types":["core.media.album","core.media.series","marfa.podcast.show"]}],"fields":[{"name":"position","type":"number","required":false,"description":"Ordering within the collection (1-based)."}],"file":"core/edges/in-collection.json","group":"edges","extra":null},"edge/in-thread":{"kind":"edge","key":"edge/in-thread","id":"in-thread","label":"In thread","description":"Source item is in the thread-target sequence. Each source is in at most one thread; the target is the thread item. Carries position for ordering.","cardinality":"many-to-one","cascade":"orphan","source":[{"kind":"any"}],"target":[{"kind":"any"}],"fields":[{"name":"position","type":"number","required":false,"description":"Ordering within the thread (1-based)."}],"file":"core/edges/in-thread.json","group":"edges","extra":null},"edge/parent-of":{"kind":"edge","key":"edge/parent-of","id":"parent-of","label":"Parent of","description":"Source is the parent of the target. Target has at most one parent. Deleting the parent cascades to children.","cardinality":"one-to-many","cascade":"cascade","source":[{"kind":"any"}],"target":[{"kind":"any"}],"fields":[],"file":"core/edges/parent-of.json","group":"edges","extra":null},"edge/references":{"kind":"edge","key":"edge/references","id":"references","label":"References","description":"Source explicitly references the target. Distinct from `about` (topical) and `derived-from` (provenance). Covers wikilink-style mentions and the highlight-on-a-book case.","cardinality":"many-to-many","cascade":"orphan","source":[{"kind":"any"}],"target":[{"kind":"any"}],"fields":[],"file":"core/edges/references.json","group":"edges","extra":null},"edge/supersedes":{"kind":"edge","key":"edge/supersedes","id":"supersedes","label":"Supersedes","description":"Source replaces the target as the current version. Linear chain; no cycles. Deleting the head does not promote the predecessor (orphan).","cardinality":"one-to-one","cascade":"orphan","source":[{"kind":"any"}],"target":[{"kind":"any"}],"fields":[],"file":"core/edges/supersedes.json","group":"edges","extra":null},"guide/core-types":{"kind":"guide","key":"guide/core-types","id":"guide/core-types","group":"guide","label":"Core types","description":"What an item is, what a type declares about it, and the rules every shipped type keeps.","fields":[],"next":"guide/custom-types","blocks":[["h2","Items"],["p","An item is one record. Beside its `id` and `source`, it carries these parts. A type declares fields; an item carries properties, the values those fields govern. {{items.md 1}} {{GLOSSARY.md, property}}"],["table",["Part","What it holds"],[["`type`","What the item is, such as `core.note`."],["`properties`","The values the type validates; a missing or invalid one is refused `400 invalid_properties`. {{items.md 14}}"],["`state`","Its lifecycle: `active`, `archived` or `trashed`, or `revoked` on a `system.*` item. {{items.md 25}}"],["`tier`","Its layer: `library` unless told `feed`. A `system.*` item has none. {{items.md 7}}"],["`occurred_at`","The item's own time, stored as sent; `created_at` when omitted. {{items.md 6}}"],["`version`","Starts at 1 and rises by one per update, which names the version it read. {{versions.md 1, 2, 6}}"]]],["h2","What a type declares"],["p","A type is a definition with an identifier, a label, a description, a `version` and a map of fields, each with a type and a description. Around the fields sit these declarations."],["table",["Declaration","What it does"],[["`required`","The fields every item of the type must carry. {{items.md 14}}"],["`display_hints`","The title field and the body field, so a reader with no code for the type can still show it."],["`merge_policy`","How concurrent edits settle, per field and by default: `last_writer_wins`, or `keep_both_copies`, which writes the losing value to a sibling item. {{types.md 12}} {{versions.md 13}}"],["`searchable`","Set to false, keeps a field out of full-text search; the value stays readable. {{types.md 15}}"]]],["h2","Reserved roots"],["p","Three roots belong to the platform: `core`, `system` and `marfa`. No key can register under them, not even the broadest credential, because the reservation is a property of the build rather than of the request. The refusal is `403 forbidden`, naming the root. The check is on the whole first segment, so `core-pub.deal` is an ordinary type. {{types.md 2}}"],["table",["Root","In this build","Holds"],[["`core`","21 types","The shared vocabulary: notes, tasks, events, media, entities, files."],["`system`","8 types","What the server records about itself. No key can write one. {{items.md 16}}"],["`marfa`","3 types","Source types for Marfa's own connectors."]]],["h2","Inheritance"],["p","A type may name a `parent`. It then carries the parent's fields beside its own, and its items accept the parent's properties. It may add fields and restate an inherited one unchanged, but changing an inherited field's shape is refused `400 inheritance_violation`, from either side: a parent cannot gain a field a child already declares with another shape. {{types.md 8}}"],["p","A listing by a parent returns its subtypes' items too, and a listing by the subtype only its own: `core.entity` returns people and places, `core.entity.person` returns people. {{types.md 9, 23}} The merge policy resolves through the same chain, a child's entries layering over its parent's. {{types.md 12}}"],["h2","Versions and immutability"],["p","A registered type changes through `PUT /types/{id}`, a versioned replacement: adding a field needs a version bump, removing one without a bump is refused `422 version_bump_mismatch`, and a descriptive change may keep its number. {{types.md 13}}"],["p","A shipped type cannot be changed that way: replacing or deleting one is refused `403 core_type_immutable`. {{types.md 13, 14}} It changes only when a new build ships it at a higher version. `core.media.series`, at version 4, has moved that way. So the build an instance runs, not whoever holds a key, settles what a shipped type means, and its description is held to its sentences like anything else the server publishes about itself. {{types.md 2, 24}}"]],"headings":["Items","What a type declares","Reserved roots","Inheritance","Versions and immutability"]},"guide/custom-types":{"kind":"guide","key":"guide/custom-types","id":"guide/custom-types","group":"guide","label":"Custom Types","description":"Naming and registering your own types, how they relate to the core types, and the levers an instance holds over them.","fields":[],"previous":"guide/core-types","blocks":[["h2","Identifiers"],["p","A type identifier is two or more lowercase segments joined by dots, each of letters, digits, hyphens and underscores, at most 128 characters. A malformed identifier answers `400 validation_error`; a well-formed one nothing has registered answers `400 unknown_type`. {{types.md 1}}"],["table",["Identifier","Answer"],[["`acme.deal`","Well formed: under the publisher handle `acme`."],["`user.recipe`","Well formed: a user type."],["`app.example.bookmark`","Well formed: an app type, with two segments after `app`."],["`app.bookmark`","Refused: one segment after `app`."],["`bookmark`, `Core.Bookmark`","Refused: one segment, or an uppercase letter."],["`core.recipe`","Well formed, refused `403 forbidden`: a reserved root. {{types.md 2}}"]]],["p","Twelve more roots fail the grammar, because a type under them could be written and never granted: the permission roots `schema`, `keys`, `items`, `webhooks`, `config`, `audit` and `grants`; the scope roots `content`, `metadata`, `edge` and `profile`; and `space`. None can be a publisher handle. {{types.md 1}} {{GLOSSARY.md, Permissions}}"],["h2","Registering"],["p","`POST /types` with an `id` and `fields` answers `201`; the type then lists, reads and validates items. {{types.md 3}} Registering takes `metadata.types:write`; replacing or deleting takes `schema.write`. {{types.md 4, 13, 14}} A field named like a first-class item field, such as `type`, is refused `400 property_shadows_field`. {{types.md 5}}"],["h2","Parent or `compatible_with`"],["p","`parent` says is-a: the type is a kind of its parent, inherits its fields and appears in the parent's listings. `compatible_with` says reads-as: the type declares its own fields in full and claims every required field of the target, with the same shape, so a reader of the target can read it. The claim is checked at registration: `422 compatible_with_violation`. {{types.md 8, 9, 10}}"],["table",["","`parent`","`compatible_with`"],[["Says","is a kind of","can be read as"],["Fields","inherited","declared in full"],["Use it when","your type refines a core type and belongs beside it","your type keeps an outside source's own shape"]]],["p","In this build, `google.calendar.event` reads as `core.event`, `google.tasks.task` reads as `core.task`, `google.youtube.video` reads as `core.media` and `raindrop.raindrop` reads as `core.bookmark`. The other 12 connector types stand alone."],["h2","Connector types"],["p","A connector writes items like any other key, under its key's source. {{items.md 4}} Two patterns are legitimate."],["ul",["Write a core type directly. The item lands in the library, readable by everything, trading fidelity for interoperability, in the words of `marfa.podcast.show`.","Write a source-fidelity type into the feed and promote it. Promoting makes a core-typed library copy that points back with a `derived-from` edge; the feed item stays as it came. The connector type must be readable as a core type, by `parent` or `compatible_with`. {{GLOSSARY.md, promote}}"]],["h2","Tiers and states"],["p","`library` holds what a person chose to keep, in a core type or a child of one; `feed` holds what arrives in volume, as it came, until promoted or archived. A create lands in the library unless the body or the key's `default_tier` says feed. {{items.md 7}} {{GLOSSARY.md, tier}}"],["p","Every canonical type, custom ones included, moves items between `active`, `archived` and `trashed` along one graph; `revoked` belongs to `system.*` types alone and is final. {{items.md 25}} {{types.md 11}}"],["h2","Enforcement levers"],["p","Three levers sit in the instance configuration, read and replaced with `config.manage`. {{types.md 16}}"],["table",["Lever","Effect"],[["Strict mode, `enforcement.strict_mode.types`","Refuses undeclared properties on the named types, `400 invalid_properties`. Off by default. {{types.md 17}}"],["Source allowlist, `enforcement.source_allowlist`","Refuses creates on the named types from unlisted sources, `403 forbidden`. {{types.md 18}}"],["Source filter, `enforcement.source_filter`","Narrows every read that returns a set to the listed sources, never a read by id. {{types.md 19}}"]]]],"headings":["Identifiers","Registering","Parent or `compatible_with`","Connector types","Tiers and states","Enforcement levers"]}},"failures":[]}</script>
<script>
(function () {
  'use strict';

  var DATA = JSON.parse(document.getElementById('marfa-data').textContent);
  var ITEMS = DATA.items;
  var GROUPS = {};
  DATA.groups.forEach(function (g) { GROUPS[g.key] = g; });

  var nav = document.getElementById('nav');
  var main = document.getElementById('main');
  var search = document.getElementById('search');
  var query = '';

  // Which groups are closed: kept for the browser session. During a search the
  // groups with matches open, and a click only closes one for that search.
  var STORE = 'marfa-types.closed-groups';
  var closed = {};
  try { closed = JSON.parse(sessionStorage.getItem(STORE) || '{}') || {}; } catch (e) { closed = {}; }
  var closedWhileSearching = {};
  function saveClosed() {
    try { sessionStorage.setItem(STORE, JSON.stringify(closed)); } catch (e) { /* in-memory only */ }
  }

  // Helpers

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function hrefFor(key) {
    return '#' + key.replace(/[^A-Za-z0-9._\-\/:]/g, encodeURIComponent);
  }
  function link(key, text) {
    var item = ITEMS[key];
    if (!item) return '<span class="ident">' + esc(text) + '</span>';
    return '<a class="ident" href="' + hrefFor(key) + '" title="' + esc(item.label) + '">' + esc(text) + '</a>';
  }
  function typeLink(id) { return link(id, id); }
  function list(parts) { return parts.join(', '); }
  function joinAnd(parts) {
    if (parts.length < 2) return parts.join('');
    return parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1];
  }
  function orList(parts) {
    if (parts.length < 2) return parts.join('');
    return parts.slice(0, -1).join(', ') + ' or ' + parts[parts.length - 1];
  }
  function humanise(s) {
    s = String(s).replace(/_/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2').toLowerCase();
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  // Long identifiers may wrap after an underscore or a dot, never mid-word.
  function breakable(s) { return esc(s).replace(/([_.])/g, '$1<wbr>'); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function firstSentence(s) {
    var m = /^[\s\S]*?[.!?](?=\s+[A-Z(`"]|$)/.exec(s || '');
    return m ? m[0] : (s || '');
  }

  // Prose: backticked spans become identifiers, dotted type ids link to their type,
  // and {{chapter n}} becomes a small citation.
  var DOTTED = /[A-Za-z][A-Za-z0-9_]*(?:\.[A-Za-z0-9_]+)+/g;
  var CITE = /\{\{(.+?)\}\}/g;
  function linkIds(text, links) {
    if (!links) return esc(text);
    var out = '', last = 0, m;
    DOTTED.lastIndex = 0;
    while ((m = DOTTED.exec(text))) {
      if (ITEMS[m[0]] && ITEMS[m[0]].kind === 'type') {
        out += esc(text.slice(last, m.index)) + typeLink(m[0]);
        last = m.index + m[0].length;
      }
    }
    return out + esc(text.slice(last));
  }
  function prose(text, links) {
    var out = '', last = 0, m;
    CITE.lastIndex = 0;
    while ((m = CITE.exec(text))) {
      out += linkIds(text.slice(last, m.index), links) + '<span class="cite">' + esc(m[1]) + '</span>';
      last = m.index + m[0].length;
    }
    return out + linkIds(text.slice(last), links);
  }
  function ident(s, links) {
    if (links && ITEMS[s] && ITEMS[s].kind === 'type') return typeLink(s);
    if (links && ITEMS['edge/' + s]) return link('edge/' + s, s);
    return '<span class="ident">' + esc(s) + '</span>';
  }
  function inline(text, links) {
    if (!text) return '';
    var parts = String(text).split('`');
    var out = '';
    for (var i = 0; i < parts.length; i++) {
      var closedSpan = i % 2 === 1 && i < parts.length - 1;
      if (closedSpan) out += ident(parts[i], links);
      else out += (i % 2 === 1 ? '`' : '') + prose(parts[i], links);
    }
    return out;
  }

  // Search: id, label, description and field names; a guide page by its title and headings.

  function tokens() {
    return query.toLowerCase().split(/\s+/).filter(Boolean);
  }
  function haystack(item) {
    if (!item._hay) {
      item._hay = [item.id, item.label, item.description].concat(item.headings || []).join(' ').toLowerCase();
    }
    return item._hay;
  }
  function matchItem(item, toks) {
    if (!toks.length) return { ok: true, fields: [] };
    var hay = haystack(item);
    var names = (item.fields || []).map(function (f) { return f.name; });
    var ok = toks.every(function (t) {
      return hay.indexOf(t) !== -1 || names.some(function (n) { return n.toLowerCase().indexOf(t) !== -1; });
    });
    var fields = ok ? names.filter(function (n) {
      return toks.some(function (t) { return n.toLowerCase().indexOf(t) !== -1; });
    }) : [];
    return { ok: ok, fields: fields };
  }
  function fieldMatches(name) {
    var toks = tokens();
    if (!toks.length) return false;
    name = name.toLowerCase();
    return toks.some(function (t) { return name.indexOf(t) !== -1; });
  }
  function visibleKeys() {
    var toks = tokens(), keys = [];
    DATA.groups.forEach(function (g) {
      g.items.forEach(function (k) { if (matchItem(ITEMS[k], toks).ok) keys.push(k); });
    });
    return keys;
  }

  // Sidebar

  function buildNav() {
    var html = '<a class="nav-item nav-top" href="#" data-home data-key="" id="nav-overview">Overview</a>';
    DATA.groups.forEach(function (g) {
      var id = 'group-' + g.key.replace(/[^A-Za-z0-9]/g, '-');
      html += '<div class="group" data-group="' + esc(g.key) + '">' +
        '<button type="button" class="group-title" aria-expanded="true" aria-controls="' + id + '">' +
        '<span class="gt-name">' + esc(g.title) + '</span><span class="gt-count">' + g.items.length + '</span>' +
        '<span class="chev" aria-hidden="true"></span></button><div class="group-items" id="' + id + '">';
      g.items.forEach(function (k) {
        var item = ITEMS[k];
        var depth = g.depth[k] || 0;
        html += '<a class="nav-item" href="' + hrefFor(k) + '" data-key="' + esc(k) + '"' +
          (item.kind === 'guide' ? '' : ' title="' + esc(item.id) + '"') +
          ' style="padding-left:' + (10 + depth * 14) + 'px">' + esc(item.label) + '</a>';
      });
      html += '</div></div>';
    });
    html += '<p class="nav-empty" id="nav-empty" hidden>No matches.</p>';
    nav.innerHTML = html;
    nav.querySelectorAll('.group-title').forEach(function (button) {
      button.addEventListener('click', function () {
        var key = button.parentNode.getAttribute('data-group');
        if (tokens().length) {
          closedWhileSearching[key] = !closedWhileSearching[key];
        } else {
          closed[key] = !closed[key];
          saveClosed();
        }
        updateNav();
      });
    });
  }
  function updateNav() {
    var toks = tokens(), searching = toks.length > 0, any = false;
    nav.querySelectorAll('.group').forEach(function (group) {
      var key = group.getAttribute('data-group'), shown = 0;
      group.querySelectorAll('.nav-item').forEach(function (a) {
        var ok = matchItem(ITEMS[a.getAttribute('data-key')], toks).ok;
        a.hidden = !ok;
        if (ok) shown++;
      });
      var total = GROUPS[key].items.length;
      var open = searching ? !closedWhileSearching[key] : !closed[key];
      group.hidden = searching && shown === 0;
      group.classList.toggle('closed', !open);
      group.querySelector('.group-title').setAttribute('aria-expanded', open ? 'true' : 'false');
      group.querySelector('.group-items').hidden = !open;
      group.querySelector('.gt-count').textContent = searching ? shown + ' of ' + total : total;
      if (shown) any = true;
    });
    document.getElementById('nav-empty').hidden = any || !searching;
  }
  function markActive(key) {
    var active = null;
    nav.querySelectorAll('.nav-item').forEach(function (a) {
      var on = key !== null && a.getAttribute('data-key') === key;
      a.classList.toggle('active', on);
      if (on) { a.setAttribute('aria-current', 'page'); active = a; }
      else a.removeAttribute('aria-current');
    });
    if (!active) return;
    var group = active.closest('.group');
    if (group && !tokens().length) {
      var gk = group.getAttribute('data-group');
      if (closed[gk]) { closed[gk] = false; saveClosed(); updateNav(); }
    }
    if (active.offsetParent === null) return;
    var r = active.getBoundingClientRect(), n = nav.getBoundingClientRect();
    if (r.top < n.top || r.bottom > n.bottom) nav.scrollTop += r.top - n.top - nav.clientHeight / 3;
  }

  // Pieces of a type page

  function typeCell(f) {
    var t = f.type || 'unknown', fmt = f.format || null;
    if (t === 'string' && fmt && ['url', 'email', 'datetime', 'date', 'thumbnail'].indexOf(fmt) !== -1) {
      t = fmt; fmt = null;
    } else if (fmt === t) {
      fmt = null;
    }
    var notes = [];
    if (f.enum && f.enum.length) {
      notes.push('One of ' + orList(f.enum.map(function (v) { return '<span class="val">' + esc(v) + '</span>'; })));
    }
    if (t === 'array') {
      var itemWords = { string: 'strings', object: 'objects', number: 'numbers', integer: 'integers',
        boolean: 'true or false values', url: 'URLs', email: 'email addresses', date: 'dates',
        datetime: 'dates and times', enum: 'enum values' };
      notes.push(f.items ? 'List of ' + esc(itemWords[f.items] || f.items + ' values') : 'List');
    }
    if (fmt) {
      var formatWords = { bcp47: 'BCP 47 language tag', iso3166: 'ISO 3166 country code' };
      notes.push(esc(formatWords[fmt] || 'Format ' + fmt));
    }
    if (f.maxItems != null) notes.push('At most ' + esc(f.maxItems) + ' items');
    if (f.maxLength != null) notes.push('At most ' + esc(f.maxLength) + ' characters');
    if (f.searchable === false) notes.push('Not indexed for search');
    if (f.extra) {
      Object.keys(f.extra).forEach(function (k) {
        notes.push(esc(humanise(k)) + ': ' + esc(JSON.stringify(f.extra[k])));
      });
    }
    return '<span class="type">' + esc(t) + '</span>' +
      notes.map(function (n) { return '<span class="note">' + n + '</span>'; }).join('');
  }
  function fieldsTable(fields) {
    var rows = fields.map(function (f) {
      var refines = f.refines ? '<span class="note">Refines ' + typeLink(f.refines) + '</span>' : '';
      return '<tr' + (fieldMatches(f.name) ? ' class="match"' : '') + '>' +
        '<td data-label="Field"><span class="fname">' + breakable(f.name) + '</span>' + refines + '</td>' +
        '<td data-label="Type">' + typeCell(f) + '</td>' +
        '<td data-label="Required">' + (f.required ? '<span class="req">Yes</span>' : '<span class="opt">No</span>') + '</td>' +
        '<td data-label="Description">' + inline(f.description, true) + '</td>' +
        '</tr>';
    }).join('');
    return '<div class="table-wrap"><table class="fields">' +
      '<colgroup><col class="c-field"><col class="c-type"><col class="c-req"><col></colgroup>' +
      '<thead><tr><th scope="col">Field</th><th scope="col">Type</th><th scope="col">Required</th><th scope="col">Description</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
  }
  function fact(label, value) {
    return value ? '<div><dt>' + esc(label) + '</dt><dd>' + value + '</dd></div>' : '';
  }
  function kv(rows) {
    return '<dl class="kv">' + rows.join('') + '</dl>';
  }
  function kvRow(term, value) {
    return '<dt>' + term + '</dt><dd>' + value + '</dd>';
  }
  function inheritedNote(from) {
    return from ? '<p class="section-note">Inherited from ' + typeLink(from) + '</p>' : '';
  }
  function header(item) {
    return '<h1>' + esc(item.label) + '</h1>' +
      '<p class="type-id">' + esc(item.id) + '</p>' +
      (item.description ? '<p class="desc">' + inline(item.description, true) + '</p>' : '');
  }
  function extraSection(extra) {
    if (!extra) return '';
    return '<section><h2>Other properties</h2>' + kv(Object.keys(extra).map(function (k) {
      var v = extra[k];
      return kvRow(esc(humanise(k)), esc(typeof v === 'string' ? v : JSON.stringify(v)));
    })) + '</section>';
  }

  function renderType(t) {
    var parent = '';
    if (t.parent) {
      parent = ITEMS[t.parent] ? typeLink(t.parent) : '<span class="ident">' + esc(t.parent) + '</span> <span class="muted">(not found)</span>';
    }
    var roles = t.roles.map(function (r) {
      return esc(r.role) + (r.from ? ' <span class="muted">from</span> ' + typeLink(r.from) : '');
    });
    var facts = '<dl class="facts">' +
      fact('Version', t.version != null ? esc(t.version) : '') +
      fact('Parent', parent) +
      fact('Children', list(t.children.map(typeLink))) +
      fact('Compatible with', list(t.compatibleWith.map(typeLink))) +
      fact('Declared compatible by', list(t.compatibleFrom.map(typeLink))) +
      fact('Roles', list(roles)) +
      fact('File', esc(t.file)) +
      '</dl>';

    var html = '<article class="doc">' + header(t) + facts;

    html += '<section><h2>Fields <span class="count">' + t.fields.length + '</span></h2>' +
      (t.fields.length ? fieldsTable(t.fields) : '<p class="empty">No fields of its own.</p>') + '</section>';

    if (t.inherited.length) {
      var total = t.inherited.reduce(function (n, g) { return n + g.fields.length; }, 0);
      html += '<section><h2>Inherited fields <span class="count">' + total + '</span></h2>';
      t.inherited.forEach(function (g) {
        var from = ITEMS[g.from];
        html += '<h3>From ' + link(g.from, from ? from.label : g.from) + '<span class="muted">' + esc(g.from) + '</span></h3>' +
          fieldsTable(g.fields);
      });
      html += '</section>';
    }

    if (t.displayHints) {
      var hints = t.displayHints.values;
      html += '<section><h2>Display hints</h2>' + inheritedNote(t.displayHints.from) +
        kv(Object.keys(hints).map(function (k) {
          var v = hints[k];
          return kvRow(esc(humanise(k)), typeof v === 'string' ? '<span class="ident">' + esc(v) + '</span>' : esc(JSON.stringify(v)));
        })) + '</section>';
    }

    if (t.mergePolicy) {
      var mp = t.mergePolicy;
      var sources = [];
      if (mp.default) sources.push(mp.default.from);
      mp.fields.forEach(function (f) { sources.push(f.from); });
      var single = sources.every(function (s) { return s === sources[0]; });
      var from = function (s) { return !single && s ? ' <span class="muted">from</span> ' + typeLink(s) : ''; };
      var rows = [];
      if (mp.default) rows.push(kvRow('Default', esc(humanise(mp.default.value)) + from(mp.default.from)));
      if (mp.fields.length) {
        rows.push('<dt class="sub">Per field</dt>');
        mp.fields.forEach(function (f) {
          rows.push(kvRow('<span class="ident">' + esc(f.name) + '</span>', esc(humanise(f.value)) + from(f.from)));
        });
      }
      html += '<section><h2>Merge policy</h2>' + (single ? inheritedNote(sources[0]) : '') + kv(rows) + '</section>';
    }

    if (t.versionPolicy) {
      html += '<section><h2>Version policy</h2>' + kv(Object.keys(t.versionPolicy).map(function (k) {
        return kvRow(esc(humanise(k)), esc(JSON.stringify(t.versionPolicy[k])));
      })) + '</section>';
    }

    html += extraSection(t.extra);
    return html + '</article>';
  }

  function constraint(c) {
    if (c.kind === 'any') return 'Any type';
    if (c.kind === 'role') {
      var members = c.types.length ? ': ' + list(c.types.map(typeLink)) : ' <span class="muted">(none at present)</span>';
      return 'Any type with the <span class="ident">' + esc(c.role) + '</span> role' + members;
    }
    var name = c.exists ? typeLink(c.id) : '<span class="ident">' + esc(c.id) + '</span> <span class="muted">(not found)</span>';
    return name + (c.hasChildren ? ' <span class="muted">and its subtypes</span>' : '');
  }
  function cardinality(e) {
    return e.cardinality ? humanise(String(e.cardinality).replace(/-/g, ' ')) : '';
  }

  function renderEdge(e) {
    var facts = '<dl class="facts">' +
      fact('Cardinality', esc(cardinality(e))) +
      fact('On delete', e.cascade ? esc(humanise(e.cascade)) : '') +
      fact('File', esc(e.file)) +
      '</dl>';
    var html = '<article class="doc">' + header(e) + facts;
    html += '<section><h2>Endpoints</h2>' + kv([
      kvRow('Source', e.source.length ? e.source.map(constraint).join('<br>') : '<span class="muted">Not stated</span>'),
      kvRow('Target', e.target.length ? e.target.map(constraint).join('<br>') : '<span class="muted">Not stated</span>')
    ]) + '</section>';
    html += '<section><h2>Properties <span class="count">' + e.fields.length + '</span></h2>' +
      (e.fields.length ? fieldsTable(e.fields) : '<p class="empty">No properties.</p>') + '</section>';
    html += extraSection(e.extra);
    return html + '</article>';
  }

  function renderGuide(g) {
    var html = '<article class="doc guide"><h1>' + esc(g.label) + '</h1>' +
      (g.description ? '<p class="lede">' + inline(g.description, true) + '</p>' : '');
    g.blocks.forEach(function (b) {
      if (b[0] === 'h2') {
        html += '<h2>' + inline(b[1], false) + '</h2>';
      } else if (b[0] === 'p') {
        html += '<p>' + inline(b[1], true) + '</p>';
      } else if (b[0] === 'ul') {
        html += '<ul>' + b[1].map(function (li) { return '<li>' + inline(li, true) + '</li>'; }).join('') + '</ul>';
      } else if (b[0] === 'table') {
        html += '<div class="table-wrap"><table class="plain"><thead><tr>' +
          b[1].map(function (h) { return '<th scope="col">' + inline(h, false) + '</th>'; }).join('') +
          '</tr></thead><tbody>' +
          b[2].map(function (row) {
            return '<tr>' + row.map(function (c) { return '<td>' + inline(c, true) + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table></div>';
      }
    });
    if (g.next && ITEMS[g.next]) html += '<p class="pager">Next: ' + link(g.next, ITEMS[g.next].label) + '</p>';
    if (g.previous && ITEMS[g.previous]) html += '<p class="pager">Previous: ' + link(g.previous, ITEMS[g.previous].label) + '</p>';
    return html + '</article>';
  }

  // Overview and search results

  function relation(item) {
    if (item.kind === 'edge') return esc(cardinality(item));
    if (item.kind !== 'type' || !/^connector:/.test(item.group)) return '';
    var parts = [];
    if (item.parent) parts.push('Inherits from ' + typeLink(item.parent));
    if (item.compatibleWith.length) parts.push('Compatible with ' + list(item.compatibleWith.map(typeLink)));
    return parts.length ? parts.join('; ') : 'Stands alone';
  }
  function row(item, extra) {
    var rel = relation(item);
    return '<div class="ov-row"><div class="ov-head">' +
      '<a class="ov-label" href="' + hrefFor(item.key) + '">' + esc(item.label) + '</a>' +
      (item.kind === 'guide' ? '' : '<span class="ov-id">' + esc(item.id) + '</span>') +
      (rel ? '<span class="ov-rel">' + rel + '</span>' : '') + '</div>' +
      (item.description ? '<p class="ov-desc">' + inline(firstSentence(item.description), true) + '</p>' : '') +
      (extra || '') + '</div>';
  }
  function tree(g) {
    var inGroup = {}, seen = {};
    g.items.forEach(function (k) { inGroup[k] = true; });
    function node(k) {
      if (seen[k]) return '';
      seen[k] = true;
      var item = ITEMS[k];
      var kids = (item.children || []).filter(function (c) { return inGroup[c]; });
      return '<li>' + row(item) +
        (kids.length ? '<ul class="tree">' + kids.map(node).join('') + '</ul>' : '') + '</li>';
    }
    var roots = g.items.filter(function (k) { return !(g.depth[k] > 0); });
    return '<ul class="tree">' + roots.map(node).join('') + '</ul>';
  }

  function renderOverview() {
    var core = 0, connectors = 0, publishers = 0, edges = 0, others = [];
    DATA.groups.forEach(function (g) {
      var n = g.items.length, name = g.title.toLowerCase();
      if (g.key === 'core') core = n;
      else if (/^connector:/.test(g.key)) { connectors += n; publishers++; }
      else if (g.key === 'edges') edges = n;
      else if (g.key !== 'guide') others.push(plural(n, name + ' type', name + ' types'));
    });
    var parts = [plural(core, 'core type', 'core types')];
    if (connectors) parts.push(plural(connectors, 'connector type', 'connector types') + ' from ' + plural(publishers, 'publisher', 'publishers'));
    parts = parts.concat(others);
    var guide = GROUPS.guide ? GROUPS.guide.items : [];

    var html = '<article class="doc"><h1>Marfa types</h1>' +
      '<p class="lede">This build defines ' + joinAnd(parts) + ', related by ' + plural(edges, 'edge type', 'edge types') +
      '. Read from packages/types on ' + esc(DATA.generated) + '.</p>';
    if (guide.length) {
      html += '<p class="lede">New to the model? Start with ' +
        guide.map(function (k) { return link(k, ITEMS[k].label); }).join(', then ') + '.</p>';
    }
    if (DATA.failures.length) {
      html += '<div class="failures">' + plural(DATA.failures.length, 'file', 'files') + ' could not be used:<ul>' +
        DATA.failures.map(function (f) { return '<li><span class="ident">' + esc(f.file) + '</span> ' + esc(f.error) + '</li>'; }).join('') +
        '</ul></div>';
    }
    DATA.groups.forEach(function (g) {
      if (g.key === 'guide') return;
      html += '<section class="ov-group"><h2>' + esc(g.title) + '<span class="count">' + g.items.length + '</span></h2>' +
        tree(g) + '</section>';
    });
    return html + '</article>';
  }

  function renderResults() {
    var toks = tokens(), found = 0, sections = '';
    DATA.groups.forEach(function (g) {
      var rows = '';
      g.items.forEach(function (k) {
        var item = ITEMS[k], m = matchItem(item, toks);
        if (!m.ok) return;
        found++;
        var extra = m.fields.length ? '<p class="ov-fields">' + (item.kind === 'edge' ? 'Properties: ' : 'Fields: ') +
          m.fields.map(function (n) { return '<span class="ident">' + esc(n) + '</span>'; }).join(', ') + '</p>' : '';
        rows += '<li>' + row(item, extra) + '</li>';
      });
      if (rows) sections += '<section class="ov-group"><h2>' + esc(g.title) + '</h2><ul class="tree">' + rows + '</ul></section>';
    });
    var q = '‘' + esc(query.trim()) + '’';
    return '<article class="doc"><h1>Search</h1><p class="lede">' +
      (found ? plural(found, 'match', 'matches') + ' for ' + q + '.' : 'Nothing matches ' + q + '.') +
      '</p>' + sections + '</article>';
  }

  function renderMissing(key) {
    return '<article class="doc"><h1>Not found</h1><p class="lede">There is no page called <span class="ident">' +
      esc(key) + '</span>. <a href="#">Go to the overview</a>.</p></article>';
  }

  // Routing

  function currentKey() {
    var raw = location.hash.slice(1);
    try { return decodeURIComponent(raw); } catch (e) { return raw; }
  }
  function render() {
    var key = currentKey();
    var item = key ? ITEMS[key] : null;
    if (!key) {
      var searching = tokens().length > 0;
      main.innerHTML = searching ? renderResults() : renderOverview();
      document.title = searching ? 'Search | Marfa types' : 'Marfa types';
      markActive(searching ? null : '');
      return;
    }
    if (!item) {
      main.innerHTML = renderMissing(key);
      document.title = 'Not found | Marfa types';
      markActive(null);
      return;
    }
    if (item.kind === 'guide') {
      main.innerHTML = renderGuide(item);
      document.title = item.label + ' | Marfa types';
    } else {
      main.innerHTML = item.kind === 'edge' ? renderEdge(item) : renderType(item);
      document.title = item.label + ' (' + item.id + ') | Marfa types';
    }
    markActive(key);
  }

  function onQuery() {
    query = search.value;
    closedWhileSearching = {};
    updateNav();
    if (currentKey() && query.trim()) location.hash = '';
    else render();
  }
  function goHome() {
    if (search.value) { search.value = ''; query = ''; closedWhileSearching = {}; updateNav(); }
    if (!currentKey()) render();
  }

  search.addEventListener('input', onQuery);
  search.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var first = visibleKeys()[0];
      if (first) location.hash = hrefFor(first);
    } else if (e.key === 'Escape' && search.value) {
      search.value = '';
      onQuery();
    }
  });
  document.addEventListener('keydown', function (e) {
    var typing = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if ((e.key === '/' && !typing) || (e.key === 'k' && (e.metaKey || e.ctrlKey))) {
      e.preventDefault();
      search.focus();
      search.select();
    }
  });
  document.addEventListener('click', function (e) {
    var home = e.target.closest && e.target.closest('[data-home]');
    if (home) goHome();
  });
  window.addEventListener('hashchange', function () {
    render();
    window.scrollTo(0, 0);
  });

  buildNav();
  updateNav();
  render();
})();
</script>
</body>
</html>
