<title>Marfa types</title>
<style>
:root {
  color-scheme: light dark;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, Helvetica, Arial, sans-serif;
  --bg: #ffffff;
  --bg-side: #fafafa;
  --fg: #27272a;
  --fg-strong: #09090b;
  --muted: #71717a;
  --border: #e4e4e7;
  --subtle: #f4f4f5;
  --accent: #007aff;
  --accent-soft: rgba(0, 122, 255, 0.07);
  --ring: rgba(0, 122, 255, 0.22);
  --radius: 8px;
  --side: 280px;
  --prose: 760px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #09090b;
    --bg-side: #0e0e10;
    --fg: #d4d4d8;
    --fg-strong: #fafafa;
    --muted: #a1a1aa;
    --border: #27272a;
    --subtle: #18181b;
    --accent: #0a84ff;
    --accent-soft: rgba(10, 132, 255, 0.1);
    --ring: rgba(10, 132, 255, 0.3);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.6 var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
input, button { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Sidebar */
.sidebar {
  position: fixed; top: 0; bottom: 0; left: 0;
  width: var(--side);
  display: flex; flex-direction: column;
  background: var(--bg-side);
  border-right: 1px solid var(--border);
}
.side-head { padding: 20px 16px 10px; }
.brand {
  display: block; margin: 0 0 12px 2px;
  font-size: 15px; font-weight: 600; color: var(--fg-strong);
}
.brand:hover { text-decoration: none; }
.search {
  width: 100%; height: 36px; padding: 0 12px;
  font-size: 14px;
  background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px;
  outline: none;
}
.search::placeholder { color: var(--muted); }
.search:focus, .search:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
.nav { flex: 1; overflow-y: auto; padding: 6px 10px 32px; overscroll-behavior: contain; }
.nav-item {
  display: block; padding: 4px 10px; border-radius: 6px;
  font-size: 13.5px; line-height: 1.45; color: var(--fg);
}
.nav-item:hover { background: var(--subtle); text-decoration: none; }
.nav-item.active { background: var(--subtle); color: var(--fg-strong); font-weight: 500; }
.nav-top { font-weight: 500; color: var(--fg-strong); }
.nav-item[hidden], .group[hidden], .group-items[hidden] { display: none; }
.group { margin-top: 14px; }
.group-title {
  display: flex; align-items: center; gap: 8px;
  width: 100%; margin: 0 0 2px; padding: 4px 10px;
  background: none; border: 0; border-radius: 6px;
  font-size: 12px; font-weight: 600; color: var(--muted);
  text-align: left; cursor: pointer;
}
.group-title:hover { background: var(--subtle); color: var(--fg); }
.gt-name { flex: 1; }
.gt-count { font-weight: 400; }
.chev {
  width: 6px; height: 6px; margin: 0 2px 3px 2px;
  border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
  transform: rotate(45deg);
  transition: transform 0.15s ease;
}
.group.closed .chev { transform: rotate(-45deg); margin-bottom: 0; }
.nav-empty { padding: 12px 10px; font-size: 13.5px; color: var(--muted); }

/* Main column, centred in the space beside the sidebar */
.main { margin-left: var(--side); min-width: 0; }
.doc { max-width: 960px; margin: 0 auto; padding: 56px 48px 112px; }
h1 {
  margin: 0; font-size: 32px; line-height: 1.2; font-weight: 600;
  letter-spacing: -0.02em; color: var(--fg-strong);
}
.type-id { margin: 6px 0 0; font-size: 17px; font-weight: 500; color: var(--muted); overflow-wrap: anywhere; }
.desc { margin: 20px 0 0; font-size: 16px; line-height: 1.65; max-width: var(--prose); }
.lede { margin: 12px 0 0; font-size: 16px; line-height: 1.6; color: var(--muted); max-width: var(--prose); }
.lede + .lede { margin-top: 6px; }
.facts {
  display: flex; flex-wrap: wrap; gap: 6px 28px;
  margin: 26px 0 0; padding: 14px 0;
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  font-size: 13.5px; line-height: 1.55;
}
.facts > div { display: flex; gap: 6px; min-width: 0; }
.facts dt { color: var(--muted); white-space: nowrap; }
.facts dd { margin: 0; color: var(--fg); overflow-wrap: anywhere; }
section { margin-top: 44px; }
h2 {
  margin: 0 0 14px; font-size: 18px; line-height: 1.3; font-weight: 600;
  letter-spacing: -0.01em; color: var(--fg-strong);
}
h2 .count { margin-left: 6px; font-size: 15px; font-weight: 400; color: var(--muted); }
h3 { margin: 26px 0 10px; font-size: 14.5px; font-weight: 500; color: var(--fg-strong); }
h3 .muted { margin-left: 6px; font-weight: 400; color: var(--muted); }
.section-note { margin: -6px 0 14px; font-size: 13.5px; color: var(--muted); }
.ident { font-weight: 500; color: var(--fg-strong); }
a.ident { color: var(--accent); }
.muted { color: var(--muted); }
.empty { margin: 0; font-size: 14px; color: var(--muted); }

/* Tables */
.table-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 14px; line-height: 1.55; }
table.plain { table-layout: auto; }
col.c-field { width: 21%; }
col.c-type { width: 19%; }
col.c-req { width: 10%; }
th {
  padding: 9px 14px; text-align: left; vertical-align: bottom;
  font-size: 12.5px; font-weight: 500; color: var(--muted);
  background: var(--subtle); border-bottom: 1px solid var(--border);
}
th .ident { color: inherit; }
td { padding: 12px 14px; vertical-align: top; border-top: 1px solid var(--border); overflow-wrap: break-word; }
tbody tr:first-child td { border-top: 0; }
tr.match td { background: var(--accent-soft); }
.fname { font-weight: 500; color: var(--fg-strong); overflow-wrap: break-word; }
.type { color: var(--fg); }
.note { display: block; margin-top: 2px; font-size: 13px; line-height: 1.5; color: var(--muted); }
.val { font-weight: 500; color: var(--fg); }
.req { font-weight: 500; color: var(--fg-strong); }
.opt { color: var(--muted); }

/* Definition lists */
.kv { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 8px 28px; margin: 0; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.kv .sub { grid-column: 1 / -1; margin-top: 6px; font-size: 12.5px; font-weight: 500; color: var(--muted); }

/* Overview and search results: a light tree, no boxes */
.ov-group { margin-top: 44px; }
.tree { list-style: none; margin: 0; padding: 0; }
.tree .tree { margin: 0 0 2px 4px; padding-left: 20px; border-left: 1px solid var(--border); }
.ov-row { padding: 7px 0; }
.ov-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.ov-label { font-weight: 500; color: var(--fg-strong); }
.ov-id { font-size: 13px; color: var(--muted); }
.ov-rel { margin-left: auto; font-size: 13px; color: var(--muted); }
.ov-desc { margin: 1px 0 0; font-size: 14px; line-height: 1.55; color: var(--muted); max-width: var(--prose); }
.ov-fields { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.failures { margin: 20px 0 0; font-size: 13.5px; color: var(--muted); }
.failures ul { margin: 6px 0 0; padding-left: 18px; }

/* Guide pages */
.guide h2 { margin-top: 40px; }
.guide p, .guide ul { max-width: var(--prose); margin: 0 0 14px; font-size: 15.5px; line-height: 1.7; }
.guide .lede { margin: 12px 0 0; font-size: 16px; line-height: 1.6; }
.guide ul { padding-left: 20px; }
.guide li { margin-bottom: 8px; }
.guide .table-wrap { margin: 6px 0 18px; }
.guide td:first-child { white-space: normal; }
.cite { margin-left: 4px; font-size: 12px; font-weight: 400; color: var(--muted); white-space: nowrap; }
.pager { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 14px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
@media (max-width: 820px) {
  .sidebar { position: static; width: auto; border-right: 0; border-bottom: 1px solid var(--border); }
  .nav { max-height: 38vh; }
  .main { margin-left: 0; }
  .doc { padding: 28px 16px 72px; }
  h1 { font-size: 26px; }
  .ov-rel { margin-left: 0; flex-basis: 100%; }
}
@media (max-width: 640px) {
  .fields, .fields tbody, .fields tr, .fields td { display: block; width: auto; }
  .fields thead, .fields colgroup { display: none; }
  .fields tr { padding: 12px 14px; border-top: 1px solid var(--border); }
  .fields tbody tr:first-child { border-top: 0; }
  .fields td { padding: 0; border: 0; margin-top: 4px; }
  .fields td:first-child { margin-top: 0; }
  .fields td[data-label]:not(:first-child)::before {
    content: attr(data-label); display: inline-block; min-width: 84px; font-size: 12.5px; font-weight: 500; color: var(--muted);
  }
  .fields td[data-label="Description"]:not(:first-child)::before { display: block; }
  .fields td[data-label="Type"] .note { margin-left: 84px; }
  .fields tr.match { background: var(--accent-soft); }
  .fields tr.match td { background: none; }
  .kv { grid-template-columns: 1fr; gap: 2px; }
  .kv dd { margin-bottom: 8px; }
  table.plain td, table.plain th { padding: 10px; }
}
</style>

,"fields":[{"name":"body","value":"keep_both_copies","from":null},{"name":"notes","value":"keep_both_copies","from":null}]},"versionPolicy":null,"extra":null},"system.account_holder":{"kind":"type","key":"system.account_holder","id":"system.account_holder","label":"Account holder","description":"The graph handle for the person who owns this instance. Exactly one row, created at provisioning, so edges such as authored-by can name the account holder instead of a free-floating stand-in. It carries no profile fields: the profile endpoints remain the source of truth for username, name, bio and avatar, and mirroring them here would give the same facts two writers. Lifecycle is bounded to active/revoked. Has no tier — the curated/feed dimension does not apply.","version":1,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"core/system/account_holder.json","group":"other:system","fields":[],"inherited":[],"displayHints":null,"mergePolicy":null,"versionPolicy":null,"extra":null},"system.activity":{"kind":"type","key":"system.activity","id":"system.activity","label":"Activity","description":"User-meaningful telemetry emitted by an external-service connector at semantic boundaries — sync runs, errors, things that need user attention. Severity drives surfacing: `info` is routine, `warning` is operational, `error` is recoverable failure, `action_required` is surfaced as a Repairs-style inbox (the user has to do something — re-authorize, resolve a tombstone conflict, etc.). No server path stamps a tier on an activity item, so an activity item is no more feed-surfaced than any other `system.*` row. Lifecycle bounded to active | revoked. Has no tier by default.","version":2,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"core/system/activity.json","group":"other:system","fields":[{"name":"connection_id","type":"string","required":true,"description":"Id of the emitting system.connection item"},{"name":"severity","type":"enum","required":true,"description":"Surfacing level. `info` for routine completion, `warning` for non-blocking concerns, `error` for recoverable failure, `action_required` for items the user has to resolve (surfaced via /items?type=system.activity&filter=properties.severity eq \"action_required\")","enum":["info","warning","error","action_required"]},{"name":"summary","type":"string","required":true,"description":"Short one-liner shown in feed surfaces"},{"name":"detail","type":"object","required":false,"description":"Optional JSON context for richer rendering or programmatic resolution"}],"inherited":[],"displayHints":null,"mergePolicy":null,"versionPolicy":null,"extra":null},"system.app":{"kind":"type","key":"system.app","id":"system.app","label":"App","description":"A registered app identity. Carries the human-readable identity (display name, homepage) for an app whose types live under `app.\u003cname>.\u003ctype>`. The wire layer does not require a `system.app` record to exist when a type under `app.\u003cname>.*` registers — these records are advisory metadata for surfacing in connected-apps UIs, not registration prerequisites. Has no tier and no lifecycle status; the row's existence is the activation signal.","version":1,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"core/system/app.json","group":"other:system","fields":[{"name":"name","type":"string","required":true,"description":"Stable identifier slug used in app.\u003cname>.\u003ctype> registrations"},{"name":"display_name","type":"string","required":false,"description":"Human-readable display name"},{"name":"homepage_url","type":"url","required":false,"description":"App marketing/landing page"},{"name":"publisher_handle","type":"string","required":false,"description":"Optional reference to the publishing entity's handle"}],"inherited":[],"displayHints":null,"mergePolicy":null,"versionPolicy":null,"extra":null},"system.connection":{"kind":"type","key":"system.connection","id":"system.connection","label":"Connection","description":"An approved relationship between this instance and something outside it. `kind` discriminates between variants: `app` (an OAuth client this user has authorized) and `connector` (anything installed from a manifest, whatever its upstream — a vendor service, a protocol, Marfa's own infrastructure, or nothing at all). Lifecycle bounded to active | revoked. Has no tier.","version":5,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"core/system/connection.json","group":"other:system","fields":[{"name":"kind","type":"enum","required":true,"description":"Discriminator for connection variant","enum":["app","connector"]},{"name":"client_id","type":"string","required":false,"description":"OAuth client identifier (for kind: app)"},{"name":"scopes","type":"array","required":false,"description":"Granted scope strings","items":"string"},{"name":"status","type":"enum","required":true,"description":"Lifecycle status (universal across all kinds)","enum":["active","revoked"]},{"name":"granted_at","type":"datetime","required":true,"description":"When the grant was approved"},{"name":"last_used_at","type":"datetime","required":false,"description":"Most recent successful use of any token issued under this grant"},{"name":"revoked_at","type":"datetime","required":false,"description":"When the grant was revoked, if any"},{"name":"connector_id","type":"string","required":false,"description":"For kind: connector — id of the Connector manifest this connection implements"},{"name":"credential_id","type":"string","required":false,"description":"For kind: connector — id of a system.credential item holding the credential the connector authenticates its upstream with"},{"name":"configuration","type":"object","required":false,"description":"For kind: connector — per-Connector JSON config payload (shape e,"description":"Semver of this Connector release (e.g. `1.0.3`). Distinct from `manifest_schema_version` (which is the contract version of the manifest format itself)."},{"name":"publisher","type":"string","required":true,"description":"Handle of whoever wrote the Connector and is accountable for it, e.g. `acme`. A different question from the namespace in `manifest_name`, and often a different answer. Carried over from manifest.publisher for list-view display."},{"name":"summary","type":"string","required":false,"description":"Short Connector description from the manifest, surfaced on the install consent screen."},{"name":"direction","type":"enum","required":false,"description":"Read/write direction declared by the manifest. Drives consent-screen wording.","enum":["read","write","both"]},{"name":"manifest","type":"object","required":true,"description":"Full validated ConnectorManifest blob. Immutable for the lifetime of this item — new releases register as siblings."},{"name":"registered_at","type":"datetime","required":true,"description":"When the manifest was registered with the server."}],"inherited":[],"displayHints":null,"mergePolicy":null,"versionPolicy":null,"extra":null},"system.credential":{"kind":"type","key":"system.credential","id":"system.credential","label":"Credential","description":"An API key or OAuth approval. Surfaces a Credentials list; carries permissions and last-used time; revocable. Lifecycle is bounded to active/revoked. Has no tier. For kind: oauth_token, the connector's OAuth provider config (upstream URLs, client id) is stored under `oauth_provider_config` and the client secret under `secret_encrypted` (AES-256-GCM via the connectionOauthToken HKDF domain). For kind: api_token, the upstream API base URL is stored under `api_token_config.upstream_base_url` and the user-supplied bearer token under `secret_encrypted` (same HKDF domain — no separate key minting). The companion connection items reference credentials via `credential_id`.","version":1,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"core/system/credential.json","group":"other:system","fields":[{"name":"label","type":"string","required":true,"description":"Human-readable label"},{"name":"kind","type":"enum","required":true,"description":"Credential kind","enum":["api_key","oauth_token","api_token"]},{"name":"scopes","type":"array","required":false,"description":"Granted scope strings","items":"string"},{"name":"last_used_at","type":"datetime","required":false,"description":"Most recent use timestamp"},{"name":"oauth_provider_config","type":"object","required":false,"description":"For kind: oauth_token — non-secret OAuth provider config: { upstream_base_url, oauth_token_url, oauth_client_id }. The secret companion lives under `secret_encrypted`."},{"name":"api_token_config","type":"object","required":false,"description":"For kind: api_token — non-secret upstream API config: { upstream_base_url, auth_scheme? }. `auth_scheme` is the HTTP Authorization scheme used to present the token; one of `Bearer` | `Token` | `Basic`, default `Bearer`. Readwise's REST API requires `Token \u003ckey>`; most others accept `Bearer`. The user-supplied secret lives under `secret_encrypted`."},{"name":"secret_encrypted","type":"string","required":false,"description":"For kind: oauth_token — AES-256-GCM-encrypted client secret. For kind: api_token — AES-256-GCM-encrypted bearer token. Both encoded as base64-iv|base64-ciphertext|base64-tag, keyed via HKDF on the `connectionOauthToken` domain. Decrypted server-side only."}],"inherited":[],"displayHints":null,"mergePolicy":null,"versionPolicy":null,"extra":null},"system.device":{"kind":"type","key":"system.device","id":"system.device","label":"Device","description":"A connected device — phone, laptop, watch, sync agent. Surfaces a Devices list in the console; carries a name, kind, and last-active timestamp; revocable. Lifecycle is bounded to active/revoked. Has no tier — the curated/feed dimension does not apply.","version":1,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"core/system/device.json","group":"other:system","fields":[{"name":"name","type":"string","required":true,"description":"Display name (e.g. \"Work laptop\")"},{"name":"kind","type":"enum","required":true,"description":"Device class","enum":["phone","tablet","laptop","desktop","watch","sync-agent","other"]},{"name":"last_active_at","type":"datetime","required":false,"description":"Most recent activity timestamp"}],"inherited":[],"displayHints":null,"mergePolicy":null,"versionPolicy":null,"extra":null},"system.webhook":{"kind":"type","key":"system.webhook","id":"system.webhook","label":"Webhook","description":"A registered webhook subscription. Surfaces a Webhooks list; carries URL, event filter, delivery history; editable. Lifecycle is bounded to active/revoked. Has no tier.","version":1,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"core/system/webhook.json","group":"other:system","fields":[{"name":"url","type":"url","required":true,"description":"Delivery URL"},{"name":"events","type":"array","required":true,"description":"Subscribed event family names","items":"string"},{"name":"type_filter","type":"string","required":false,"description":"Optional type-id filter narrowing deliveries"},{"name":"active","type":"boolean","required":false,"description":"Subscription enabled"}],"inherited":[],"displayHints":null,"mergePolicy":null,"versionPolicy":null,"extra":null},"core.task":{"kind":"type","key":"core.task","id":"core.task","label":"Task","description":"Something to be done.","version":1,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":["google.tasks.task"],"children":[],"roles":[],"file":"core/task.json","group":"core","fields":[{"name":"title","type":"string","required":true,"description":"What needs doing"},{ ibleWith":["core.event"],"compatibleFrom":[],"children":[],"roles":[],"file":"connectors/google.calendar.event.json","group":"connector:google","fields":[{"name":"title","type":"string","required":true,"description":"Event summary (maps to Calendar `summary`)"},{"name":"description","type":"string","required":false,"description":"Event description"},{"name":"starts_at","type":"string","required":false,"description":"Start time. ISO datetime for timed events; ISO date (YYYY-MM-DD) for all-day events.","format":"datetime"},{"name":"ends_at","type":"string","required":false,"description":"End time. ISO datetime for timed events; ISO date for all-day events.","format":"datetime"},{"name":"timezone","type":"string","required":false,"description":"IANA timezone identifier (e.g. \"Europe/London\") from Calendar `start.timeZone`. Set on timed events; omitted on all-day events. This is the start zone; `end_timezone` carries `end.timeZone` when Calendar reports a different one."},{"name":"end_timezone","type":"string","required":false,"description":"IANA timezone from Calendar `end.timeZone`, carried when it differs from `timezone`. Calendar exposes the two separately and offers the choice in its own interface, so collapsing them loses a fact the user entered."},{"name":"all_day","type":"boolean","required":false,"description":"True when the event is an all-day event (Calendar `start.date` instead of `start.dateTime`). The declared answer, not an inference from whether `starts_at` happens to carry a time."},{"name":"place","type":"string","required":false,"description":"Free-text location (maps to Calendar `location`)"},{"name":"html_link","type":"string","required":false,"description":"Stable HTTPS link to the event on the Google Calendar web UI.","format":"url"},{"name":"etag","type":"string","required":false,"description":"Calendar's change-detection token. Used for conditional updates and as the content-hash key for echo suppression."},{"name":"source_calendar_id","type":"string","required":false,"description":"ID of the Google Calendar this event lives on (the user's primary calendar, a shared work calendar, etc.). Set on inbound items so multi-calendar mappings round-trip; outbound writes derive the target calendar from this field or fall back to the connection's configured default."},{"name":"status","type":"enum","required":false,"description":"Calendar event status.","enum":["confirmed","tentative","cancelled"]},{"name":"transparency","type":"enum","required":false,"description":"Whether the event blocks time on the user's calendar (Calendar `transparency`).","enum":["opaque","transparent"]},{"name":"visibility","type":"enum","required":false,"description":"Event visibility setting (Calendar `visibility`).","enum":["default","public","private","confidential"]},{"name":"organizer_email","type":"string","required":false,"description":"Email address of the event organizer (Calendar `organizer.email`)."},{"name":"creator_email","type":"string","required":false,"description":"Email address of the event creator (Calendar `creator.email`)."},{"name":"recurrence","type":"array","required":false,"description":"RRULE / RDATE / EXDATE strings (Calendar `recurrence`). Carried verbatim so the series round-trips, and read by the occurrence expansion. EXRULE is deprecated in RFC 5545 and the expander refuses it outright rather than accepting a line it would silently not apply.","items":"string"},{"name":"recurring_event_id","type":"string","required":false,"description":"When set, this event is an instance of a recurring series; value is the Calendar event id of the series parent."},{"name":"color_id","type":"string","required":false,"description":"Calendar event color id (numeric string, 1–11; see Calendar's `colors.get`)."},{"name":"original_starts_at","type":"string","required":false,"description":"For an event that replaces one occurrence of a series, the start time of the occurrence it replaces (Calendar `originalStartTime`). Its series is named by a parent-of edge.","format":"datetime"}],"inherited":[],"displayHints":{"from":null,"values":{"title_field":"title","body_field":"description"}},"mergePolicy":null,"versionPolicy":null,"extra":null},"google.contacts.contact":{"kind":"type","key":"google.contacts.contact","id":"google.contacts.contact","label":"Google Contact","description":"A contact (person) from Google Contacts, captured with upstream fidelity. Mirrors the People API person resource — names, email addresses, phone numbers, postal addresses, organizations, biographies, etag — so a round-trip preserves what Google considers authoritative. Deliberately not `compatible_with: core.entity.person`, which requires `name`; this type carries the display name in `title` and renaming it would orphan the property on every contact already captured. The Google Contacts connector can be configured to write `core.entity.person` instead when cross-app interop matters more than upstream fidelity.","version":1,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"connectors/google.contacts.contact.json","group":"connector:google","fields":[{"name":"title","type":"string","required":true,"description":"Display name (maps to People API `names[0].displayName`). Falls back to a join of given+family names."},{"name":"given_name","type":"string","required":false,"description":"Given (first) name (maps to `names[0].givenName`)."},{"name":"family_name","type":"string","required":false,"description":"Family (last) name (maps to `names[0].familyName`)."},{"name":"middle_name","type":"string","required":false,"description":"Middle name (maps to `names[0].middleName`)."},{"name":"prefix","type":"string","required":false,"description":"Honorific prefix — Dr / Mr / Prof (maps to `names[0].honorificPrefix`)."},{"name":"suffix","type":"string","required":false,"description":"Honorific suffix — PhD / Jr / OBE (maps to `names[0].honorificSuffix`)."},{"name":"nickname","type":"string","required":false,"description":"Familiar name or alias (maps to `nicknames[0].value`)."},{"name":"emails","type":"array","required":false,"description":"Email addresses. Each entry is a JSON-encoded object: `{ value, type, formattedType }`. Round-trips the full People API `emailAddresses` array.","items":"string"},{"name":"phones","type":"array","required":false,"description":"Phone numbers. Each entry is a JSON-encoded object: `{ value, type, formattedType }`. Round-trips the full People API `phoneNumbers` array.","items":"string"},{"name":"addresses","type":"array","required":false,"description":"Postal addresses. Each entry is a JSON-encoded object with the full People API `addresses` shape — `{ formattedValue, type, streetAddress, city, region, postalCode, country, countryCode }`.","items":"string"},{"name":"organization","type":"string","required":false,"description":"Primary employer / organization name (maps to `organizations[0].name`)."},{"name":"job_title","type":"string","required":false,"description":"Job title within the primary organization (maps to `organizations[0].title`)."},{"name":"department","type":"string","required":false,"description":"Department within the primary organization (maps to `organizations[0].department`)."},{"name":"biography","type":"string","required":false,"description":"Free-text biography / notes about the contact (maps to `biographies[0].value`)."},{"name":"birthday","type":"string","required":false,"description":"Date of birth — ISO 8601 (YYYY-MM-DD or YYYY when year is unknown). Reconstructed from People API `birthdays[0].date.{year,month,day}`.","format":"date"},{"name":"photo_url","type":"string","required":false,"description":"Reference URL to the contact's photo (maps to `photos[0].url`). Stored as a URL only — no blob ingest in v1.","format":"url"},{"name":"etag","type":"string","required":false,"description":"People API change-detection token. Used as the content-hash key for echo suppression AND threaded into outbound updates as the `etag` field for optimistic-concurrency (stale etag → 409, handler refetches and reapplies)."},{"name":"resource_name","type":"string","required":false,"description":"Stable People API resource id — typically `people/c\u003cdigits>`. Used as the external_id on the cursor mapping."}],"inherited":[],"displayHints":{"from":null,"values":{"title_field":"title","body_field":"biography"}},"mergePolicy":null,"versionPolicy":null,"extra":null},"google.drive.file":{"kind":"type","key":"google.drive.file","id":"google.drive.file","label":"Google Drive File","description":"A file on Google Drive, captured with upstream fidelity. Mirrors the Drive v3 file resource closely so a round-trip preserves what Drive considers authoritative (id, name, mimeType, size, ownership, parents, links, checksums). Direction is inbound-only in v1 — the connector reads files into Marfa but does not write back. Metadata-only captures do not claim `core.file` compatibility because they have no required blob reference.","version":1,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"connectors/google.drive.file.json","group":"connector:google","fields":[{"name":"title","type":"string","required":true,"description":"File name (maps to Drive `name`)."},{"name":"mime_type","type":"string","required":true,"description":"MIME type (maps to Drive `mimeType`). Google-native types are `application/vnd.google-apps.*` and require export rather than alt=media download."},{"name":"drive_file_id","type":"string","required":true,"description":"Stable Drive file id. Used as the external_id on the cursor mapping."},{"name":"size_bytes","type":"integer","required":false,"description":"File size in bytes (maps to Drive `size`). Null for native Google formats (Docs / Sheets / Slides)."},{"name":"created_at_drive","type":"string","required":false,"description":"Drive-side created timestamp (maps to Drive `createdTime`).","format":"datetime"},{"name":"modified_at_drive","type":"string","required":false,"description":"Drive-side modified timestamp (maps to Drive `modifiedTime`). Used for incremental ordering when changes.list cursor is absent.","format":"datetime"},{"name":"owners","type":"array","required":false,"description":"Owner email addresses (each entry is the `emailAddress` of an owner from Drive's `owners` array).","items":"string"},{"name":"parents","type":"array","required":false,"description":"Parent folder ids (maps to Drive `parents`).","items":"string"},{"name":"trashed","type":"boolean","required":false,"description":"Drive `trashed` flag. Handler maps `trashed: true` to a Marfa tombstone (state-trashed) rather than persisting the flag literally."},{"name":"web_view_link","type":"string","required":false,"description":"Stable HTTPS URL to view the file in the Drive web UI (maps to Drive `webViewLink`).","format":"url"},{"name":"icon_link","type":"string","required":false,"description":"URL to a small icon for the file's type (maps to Drive `iconLink`).","format":"url"},{"name":"thumbnail_link","type":"string","required":false,"description":"URL to a short-lived thumbnail (maps to Drive `thumbnailLink`). Stored as a URL only; not downloaded.","format":"url"},{"name":"md5_checksum","type":"string","required":false,"description":"MD5 checksum of the file content (maps to Drive `md5Checksum`). Available for binary file types; absent for native Google formats."},{"name":"sha256_checksum","type":"string","required":false,"description":"SHA-256 checksum where Drive provides it (`sha256Checksum`; recent addition to the v3 API)."},{"name":"blob_ref","type":"string","required":false,"description":"Reference to the downloaded binary content as a Marfa blob (`sha256:\u003chex>`). Present iff the bytes were successfully ingested into the Marfa blob store — i.e. `connection.properties.configuration.download_mode` is `all-files` (or a matching glob), the file is downloadable (not a Google-native `application/vnd.google-apps.*` type), and the download stayed within the per-file size ceiling. Absent in metadata mode and whenever an all-files attempt was skipped or failed (the activity log carries the reason). Programmatic gate: `typeof blob_ref === \"string\"` means the bytes are retrievable via `GET /blobs/{blob_ref}`."},{"name":"etag","type":"string","required":false,"description":"Drive's change-detection token (Drive returns ETag-style hashes on most responses). Used as the content-hash key for echo suppression."}],"inherited":[],"displayHints":{"from":null,"values":{"title_field":"title"}},"mergePolicy":null,"versionPolicy":null,"extra":null},"google.tasks.task":{"kind":"type","key":"google.tasks.task","id":"google.tasks.task","label":"Google Task","description":"A task on a Google Tasks list, captured with upstream fidelity. Mirrors the Tasks API task resource closely so a round-trip preserves what Google considers authoritative (notes, due, status, completed, position, parent, links). For cross-app interop with non-Google consumers, the Google Tasks connector can also be configured to write to `core.task` instead, but the default and the fidelity choice is this type.","version":1,"parent":null,"missingParent":null,"compatibleWith":["core.task"],"compatibleFrom":[],"children":[],"roles":[],"file":"connectors/google.tasks.task.json","group":"connector:google","fields":[{"name":"title","type":"string","required":true,"description":"Task title (maps to Tasks `title`)"},{"name":"notes","type":"string","required":false,"description":"Free-text notes attached to the task (maps to Tasks `notes`)."},{"name":"due_at","type":"string","required":false,"description":"Due date. Tasks API stores due as an RFC 3339 timestamp but only the date portion is honored — time-of-day is ignored upstream.","format":"datetime"},{"name":"completed_at","type":"string","required":false,"description":"Completion timestamp (maps to Tasks `completed`). Present only when `status` is `completed`.","format":"datetime"},{"name":"status","type":"enum","required":false,"description":"Task status.","enum":["needsAction","completed"]},{"name":"position","type":"string","required":false,"description":"Stable sort key within the parent task list / subtask group (maps to Tasks `position`). Opaque, lexicographically sortable."},{"name":"parent","type":"string","required":false,"description":"Parent task id when this task is a subtask (maps to Tasks `parent`). Task lists allow one level of nesting only."},{"name":"html_link","type":"string","required":false,"description":"Stable HTTPS link to the task on the Google Tasks web UI (maps to Tasks `selfLink`/`webViewLink`).","format":"url"},{"name":"etag","type":"string","required":false,"description":"Tasks API change-detection token. Used as the content-hash key for echo suppression."},{"name":"source_task_list_id","type":"string","required":false,"description":"ID of the Google Tasks list this task lives on. Set on inbound items so per-list mappings round-trip; outbound writes derive the target list from this field or fall back to the connection's configured default."},{"name":"hidden","type":"boolean","required":false,"description":"Tasks API `hidden` flag. Set true by Google when a completed task is hidden from the default view; round-tripped for fidelity."},{"name":"deleted","type":"boolean","required":false,"description":"Tasks API `deleted` flag (surfaces when `showDeleted=true` is passed on the list). Handler maps a true value to a Marfa tombstone (state-trashed) rather than persisting the flag literally."}],"inherited":[],"displayHints":{"from":null,"values":{"title_field":"title","body_field":"notes"}},"mergePolicy":null,"versionPolicy":null,"extra":null},"google.youtube.channel":{"kind":"type","key":"google.youtube.channel","id":"google.youtube.channel","label":"YouTube Channel","description":"A YouTube channel — surfaced when the connected user has subscribed to it or when it owns a liked video or user playlist. Captures channel metadata from the YouTube Data API v3 `channels` resource. `subscribed_at` carries the time the connected user subscribed (when known); absent when the channel was surfaced solely as the owner of a liked video or playlist.","version":1,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"connectors/google.youtube.channel.json","group":"connector:google","fields":[{"name":"channel_id","type":"string","required":true,"description":"YouTube channel id — the stable handle used in canonical channel URLs (`https://www.youtube.com/channel/\u003cchannel_id>`). The external id on the cursor mapping."},{"name":"title","type":"string","required":true,"description":"Channel display name (maps to `snippet.title`)."},{"name":"description","type":"string","required":false,"description":"Channel description / about text (maps to `snippet.description`)."},{"name":"custom_url","type":"string","required":false,"description":"Vanity URL slug when set (maps to `snippet.customUrl`)."},{"name":"published_at","type":"string","required":false,"description":"Channel creation timestamp (maps to `snippet.publishedAt`) — RFC 3339.","format":"datetime"},{"name":"thumbnail_url","type":"string","required":false,"description":"Best-available channel avatar URL — picks the highest-resolution variant present (`maxres > standard > high > medium > default`).","format":"url"},{"name":"subscriber_count","type":"number","required":false,"description":"Subscriber count at the time of last fetch (maps to `statistics.subscriberCount`, parsed to a number). May be hidden by the channel owner."},{"name":"video_count","type":"number","required":false,"description":"Public video count at the time of last fetch (maps to `statistics.videoCount`, parsed to a number)."},{"name":"view_count","type":"number","required":false,"description":"Channel-lifetime view count (maps to `statistics.viewCount`, parsed to a number)."},{"name":"subscribed_at","type":"string","required":false,"description":"Timestamp the connected user subscribed to this channel (maps to `subscriberSnippet.subscribedAt`). Absent when the channel was surfaced solely as the owner of a liked video / playlist rather than via a subscription.","format":"datetime"},{"name":"html_link","type":"string","required":false,"description":"Canonical channel URL on YouTube — `https://www.youtube.com/channel/\u003cchannel_id>`.","format":"url"}],"inherited":[],"displayHints":{"from":null,"values":{"title_field":"title","body_field":"description"}},"mergePolicy":null,"versionPolicy":null,"extra":null},"google.youtube.playlist":{"kind":"type","key":"google.youtube.playlist","id":"google.youtube.playlist","label":"YouTube Playlist","description":"A YouTube playlist created by the connected user. Captures playlist metadata from the YouTube Data API v3 `playlists` resource. The owning channel is wired via a `parent-of` edge (channel = source, playlist = target). When the connection's `materialise_playlists` configuration flag is true, the per-playlist video walk wires additional `parent-of` edges from this playlist to each member video.","version":1,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"connectors/google.youtube.playlist.json","group":"connector:google","fields":[{"name":"playlist_id","type":"string","required":true,"description":"YouTube playlist id — used in canonical URLs (`https://www.youtube.com/playlist?list=\u003cplaylist_id>`). The external id on the cursor mapping."},{"name":"title","type":"string","required":true,"description":"Playlist title (maps to `snippet.title`)."},{"name":"description","type":"string","required":false,"description":"Free-text playlist description (maps to `snippet.description`)."},{"name":"channel_id","type":"string","required":false,"description":"YouTube id of the owning channel (maps to `snippet.channelId`). The corresponding `google.youtube.channel` item is wired via a `parent-of` edge (channel = source, playlist = target)."},{"name":"item_count","type":"number","required":false,"description":"Number of videos in the playlist at the time of last fetch (maps to `contentDetails.itemCount`)."},{"name":"privacy_status","type":"enum","required":false,"description":"Playlist visibility (maps to `status.privacyStatus`).","enum":["public","unlisted","private"]},{"name":"published_at","type":"string","required":false,"description":"Playlist creation timestamp (maps to `snippet.publishedAt`) — RFC 3339.","format":"datetime"},{"name":"thumbnail_url","type":"string","required":false,"description":"Best-available thumbnail URL — picks the highest-resolution variant present (`maxres > standard > high > medium > default`).","format":"url"},{"name":"etag","type":"string","required":false,"description":"YouTube Data API change-detection token. Cached on the cursor's `playlist_etags` map; an unchanged etag skips the per-playlist video walk on the next sweep."},{"name":"html_link","type":"string","required":false,"description":"Canonical playlist URL on YouTube — `https://www.youtube.com/playlist?list=\u003cplaylist_id>`.","format":"url"}],"inherited":[],"displayHints":{"from":null,"values":{"title_field":"title","body_field":"description"}},"mergePolicy":null,"versionPolicy":null,"extra":null},"google.youtube.video":{"kind":"type","key":"google.youtube.video","id":"google.youtube.video","label":"YouTube Video","description":"A YouTube video — liked by the connected user or surfaced via a walked user-created playlist. Mirrors the YouTube Data API v3 `videos` resource. `liked_at` is a property on the video (sourced from the liked-playlist item's `snippet.publishedAt`), not modeled as an edge.","version":1,"parent":null,"missingParent":null,"compatibleWith":["core.media"],"compatibleFrom":[],"children":[],"roles":[],"file":"connectors/google.youtube.video.json","group":"connector:google","fields":[{"name":"video_id","type":"string","required":true,"description":"YouTube video id — the 11-character handle used in canonical watch URLs (`https://www.youtube.com/watch?v=\u003cvideo_id>`). Used as the external id on the cursor mapping."},{"name":"title","type":"string","required":true,"description":"Video title (maps to `snippet.title`)."},{"name":"description","type":"string","required":false,"description":"Free-text video description (maps to `snippet.description`)."},{"name":"channel_id","type":"string","required":false,"description":"YouTube id of the channel that owns this video (maps to `snippet.channelId`). The corresponding `google.youtube.channel` item is wired via a `parent-of` edge (channel = source, video = target)."},{"name":"channel_title","type":"string","required":false,"description":"Display name of the owning channel at the time of fetch (maps to `snippet.channelTitle`). Cached for display; not authoritative — the canonical name lives on the linked channel item."},{"name":"published_at","type":"string","required":false,"description":"Original publish timestamp from `snippet.publishedAt` — RFC 3339.","format":"datetime"},{"name":"liked_at","type":"string","required":false,"description":"Timestamp the connected user liked this video. Sourced from the liked-playlist item's `snippet.publishedAt`, which YouTube uses to record like-time on that magic playlist.","format":"datetime"},{"name":"duration_iso8601","type":"string","required":false,"description":"Video duration in ISO 8601 duration format (e.g. `PT4M13S`). Maps to `contentDetails.duration`."},{"name":"view_count","type":"number","required":false,"description":"View count at the time of last fetch (maps to `statistics.viewCount`, parsed to a number)."},{"name":"like_count","type":"number","required":false,"description":"Like count at the time of last fetch (maps to `statistics.likeCount`, parsed to a number). May be absent when the upstream has hidden it."},{"name":"thumbnail_url","type":"string","required":false,"description":"Best-available thumbnail URL — picks the highest-resolution variant present (`maxres > standard > high > medium > default`).","format":"url"},{"name":"tags","type":"array","required":false,"description":"Free-form tags assigned by the uploader (maps to `snippet.tags`).","items":"string"},{"name":"category_id","type":"string","required":false,"description":"YouTube category id (maps to `snippet.categoryId`). Numeric string per the v3 API."},{"name":"default_audio_language","type":"string","required":false,"description":"BCP-47 language code for the video's default audio track (maps to `snippet.defaultAudioLanguage`)."},{"name":"html_link","type":"string","required":false,"description":"Canonical watch URL on YouTube — `https://www.youtube.com/watch?v=\u003cvideo_id>`.","format":"url"}],"inherited":[],"displayHints":{"from":null,"values":{"title_field":"title","body_field":"description"}},"mergePolicy":null,"versionPolicy":null,"extra":null},"marfa.captured_email":{"kind":"type","key":"marfa.captured_email","id":"marfa.captured_email","label":"Captured Email","description":"An email captured by the marfa/inbox connector via Cloudflare Email Routing → Email Worker → webhook. Parsed MIME landed as a structured item. Not yet `compatible_with: core.note`, though it is shaped for it: a note requires `body`, and captures written before the handler always populated that field do not carry it. Claiming compatibility would require `body` here, and re-validating a merged property set is how `PATCH /items/:id` works — so the claim would make every one of those older captures permanently un-editable. It can be restored once those rows are backfilled. Attachment blob upload is not yet supported; v1 captures attachment metadata (filename, mime_type, size_bytes) only.","version":1,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"connectors/marfa.captured_email.json","group":"connector:marfa","fields":[{"name":"from_address","type":"string","required":true,"description":"RFC 5321 envelope sender address, lower-cased (the `From:` header's address part)."},{"name":"from_name","type":"string","required":false,"description":"Display name from the `From:` header, if present."},{"name":"to_address","type":"string","required":true,"description":"Address the email was delivered to (the connection's capture address — e.g. `capture@inbox.marfa.so`)."},{"name":"subject","type":"string","required":false,"description":"RFC 5322 `Subject:` header. Empty string when absent."},{"name":"text_body","type":"string","required":false,"description":"Plain-text body. Either the `text/plain` MIME part directly, or downgraded from `text/html` when only HTML is present."},{"name":"body","type":"string","required":false,"description":"Mirror of `text_body`, present so a generic note reader finds a body where it expects one. Always written (empty string when the email had no text part), which is what will eventually let this type claim `core.note` compatibility."},{"name":"html_body","type":"string","required":false,"description":"HTML body (`text/html` MIME part). Captured verbatim; not sanitized on storage."},{"name":"sent_at","type":"datetime","required":false,"description":"RFC 5322 `Date:` header, parsed to ISO 8601. The upstream-fidelity timestamp; distinct from Marfa's `created_at` which stamps the inbound-receipt time."},{"name":"message_id","type":"string","required":false,"description":"RFC 5322 `Message-ID:` header (with the angle brackets). Used as the inbound-webhook `external_delivery_id` so a re-delivered email resolves to the same item. Mirrored to `source_id` at write time."},{"name":"in_reply_to","type":"string","required":false,"description":"RFC 5322 `In-Reply-To:` header. Sets up thread inference for follow-up replies on the same conversation."},{"name":"references","type":"array","required":false,"description":"RFC 5322 `References:` header, split on whitespace. Each entry a Message-ID of an ancestor in the conversation thread.","items":"string"},{"name":"headers","type":"object","required":false,"description":"Selected subset of normalized lower-case header keys → values. Pruned at parse time to a documented allowlist (List-Id, List-Unsubscribe, X-Mailer, Reply-To, Return-Path); the raw header set is not retained to keep the item shape bounded."},{"name":"attachments","type":"array","required":false,"description":"Per-attachment metadata `{ filename, mime_type, size_bytes }`. Blob upload is not yet supported — v1 captures metadata only. `blob_ref` is wired in a follow-on.","items":"object"}],"inherited":[],"displayHints":{"from":null,"values":{"title_field":"subject","body_field":"text_body"}},"mergePolicy":null,"versionPolicy":null,"extra":null},"marfa.podcast.episode":{"kind":"type","key":"marfa.podcast.episode","id":"marfa.podcast.episode","label":"Podcast Episode","description":"One episode of a podcast, as its feed item describes it. Joins its show through the in-collection edge, with the episode as the source. Mirrors an RSS 2.0 item together with the iTunes and Podcasting 2.0 namespaces, for upstream fidelity; a connection that would rather trade fidelity for interoperability writes `core.media.episode` instead. Both a raw and a normalized duration are kept, because feeds express it in several formats and the original is the only evidence of which one was meant.","version":1,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"connectors/marfa.podcast.episode.json","group":"connector:marfa","fields":[{"name":"title","type":"string","required":true,"description":"Episode title (maps to the item `title`, falling back to `itunes:title`)."},{"name":"guid","type":"string","required":false,"description":"The item's own identifier (maps to `guid`). Optional in RSS and required by Apple, so it is usually present but cannot be relied on; an item without one is identified by its enclosure address instead."},{"name":"guid_is_permalink","type":"boolean","required":false,"description":"The `isPermaLink` attribute as the feed gave it, defaulting to true when absent per RSS 2.0. Recorded rather than acted on: it says whether the guid can be dereferenced, which has no bearing on whether it is stable."},{"name":"enclosure_url","type":"string","required":false,"description":"Address of the episode's media file (maps to the item `enclosure` `url`). Where an item carries several enclosures — and modern feeds attach artwork, transcripts and captions alongside the audio — this is the audio or video one.","format":"url"},{"name":"enclosure_type","type":"string","required":false,"description":"MIME type the feed claims for the enclosure (maps to `enclosure` `type`), such as audio/mpeg or video/mp4. This is what distinguishes a video episode from an audio one; `itunes:type` does not."},{"name":"enclosure_length","type":"integer","required":false,"description":"Size in bytes the feed claims for the enclosure (maps to `enclosure` `length`). Required by the specification and frequently wrong — whole feeds report zero — so it is mirrored as claimed and should not be trusted for accounting."},{"name":"link","type":"string","required":false,"description":"The episode's own web page (maps to the item `link`). Distinct from `enclosure_url`, which is the media itself.","format":"url"},{"name":"description","type":"string","required":false,"description":"Short episode description, preferring `itunes:summary` and falling back to the item `description`."},{"name":"content_encoded","type":"string","required":false,"description":"Full show notes as published, usually HTML (maps to `content:encoded`). Kept as given rather than downgraded to text, since the markup carries the chapter links and credits."},{"name":"pub_date","type":"datetime","required":false,"description":"When the episode was published (maps to the item `pubDate`). Feeds give this in RFC 822 form, sometimes with an alphabetic timezone rather than a numeric offset."},{"name":"duration_raw","type":"string","required":false,"description":"The duration exactly as the feed wrote it (maps to `itunes:duration`), before normalization. Feeds use plain seconds, MM:SS and HH:MM:SS interchangeably, sometimes wrapped in CDATA with surrounding whitespace, so the original is kept as the evidence for how it was read."},{"name":"duration_seconds","type":"number","required":false,"description":"Duration in seconds, normalized from `duration_raw`. Absent where the feed's value could not be read as a duration."},{"name":"season_number","type":"integer","required":false,"description":"Season the episode belongs to (maps to `itunes:season`)."},{"name":"episode_number","type":"integer","required":false,"description":"Position within the season, or within the show where it has no seasons (maps to `itunes:episode`)."},{"name":"episode_type","type":"enum","required":false,"description":"Whether this is a full episode or something alongside the run (maps to `itunes:episodeType`, which defaults to full when absent).","enum":["full","trailer","bonus"]},{"name":"explicit","type":"enum","required":false,"description":"Explicitness as declared by the item's `itunes:explicit`, normalized the same way as on the show.","enum":["true","false","clean"]},{"name":"author","type":"string","required":false,"description":"Who made this episode (maps to the item `itunes:author`, falling back to `dc:creator` and then to the show's author, since most items omit it and the host is the answer)."},{"name":"image_url","type":"string","required":false,"description":"Episode artwork, from the `href` attribute of the item's `itunes:image`, falling back to the show's.","format":"url"},{"name":"feed_url","type":"string","required":false,"description":"Address of the feed this episode was read from, kept so an episode can be traced to its source without reading the show.","format":"url"},{"name":"podcast_guid","type":"string","required":false,"description":"Identifier of the show this episode belongs to, matching `podcast_guid` on `marfa.podcast.show`. The in-collection edge is the authoritative join; this is the same fact denormalized, so a reader holding an episode knows its show without a second call."}],"inherited":[],"displayHints":{"from":null,"values":{"title_field":"title","body_field":"content_encoded"}},"mergePolicy":null,"versionPolicy":null,"extra":null},"marfa.podcast.show":{"kind":"type","key":"marfa.podcast.show","id":"marfa.podcast.show","label":"Podcast Show","description":"A podcast, as its RSS feed describes it. One row per show, keyed on the show's stable identifier rather than its feed address, so a move between hosts does not create a second show. Episodes join it through the in-collection edge. Mirrors the channel element of an RSS 2.0 feed together with the iTunes and Podcasting 2.0 namespaces, for upstream fidelity; a connection that would rather trade fidelity for interoperability writes `core.media.series` instead.","version":2,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[{"role":"container","from":null}],"file":"connectors/marfa.podcast.show.json","group":"connector:marfa","fields":[{"name":"title","type":"string","required":true,"description":"Show name (maps to the channel `title`). A feed that omits it falls back to its host, since a show with no name cannot be told apart in a list."},{"name":"feed_url","type":"string","required":true,"description":"Address the feed was fetched from. Not the identity: a show that changes host keeps its guid and changes this.","format":"url"},{"name":"podcast_guid","type":"string","required":false,"description":"Stable identifier for the show, from the channel's `podcast:guid` where the feed declares one. Where it does not — which is most feeds — this is the same value computed the way the Podcasting 2.0 specification defines it, as a UUIDv5 over the feed address with the scheme and any trailing slash removed. A feed that later adds a conformant guid therefore lands on the value already stored."},{"name":"link","type":"string","required":false,"description":"The show's own web page (maps to the channel `link`). Distinct from `feed_url`, which is the machine-readable feed.","format":"url"},{"name":"description","type":"string","required":false,"description":"Show description, preferring `itunes:summary` and falling back to the channel `description`."},{"name":"author","type":"string","required":false,"description":"Who makes the show (maps to `itunes:author`, falling back to `managingEditor`, which is an address rather than a name and so is only a fallback)."},{"name":"owner_name","type":"string","required":false,"description":"Name on the feed's ownership record (maps to `itunes:owner` / `itunes:name`). The owner's email address is deliberately not mirrored."},{"name":"image_url","type":"string","required":false,"description":"Show artwork, from the `href` attribute of `itunes:image`, falling back to the channel `image` block. The iTunes element carries its value in an attribute and has no text content.","format":"url"},{"name":"language","type":"string","required":false,"description":"Language tag exactly as the feed gave it (maps to the channel `language`). Not corrected to canonical case, because a feed saying `en-us` is data about the feed."},{"name":"categories","type":"array","required":false,"description":"Category names from `itunes:category`, including nested subcategories, flattened to a list of the `text` attributes.","items":"string","maxItems":50},{"name":"itunes_type","type":"enum","required":false,"description":"Whether episodes are meant to be read newest-first or from the beginning (maps to `itunes:type`). Says nothing about audio versus video — that is carried per episode by the enclosure's MIME type.","enum":["episodic","serial"]},{"name":"complete","type":"boolean","required":false,"description":"Whether the feed declares that no further episodes will ever appear (maps to `itunes:complete`, which is present and set to yes, or absent)."},{"name":"explicit","type":"enum","required":false,"description":"Explicitness as declared by `itunes:explicit`. Normalized case-insensitively: yes and true become `true`, no and false become `false`, and `clean` is preserved because it asserts the absence of explicit content rather than merely not claiming it.","enum":["true","false","clean"]},{"name":"copyright","type":"string","required":false,"description":"Copyright line (maps to the channel `copyright`)."},{"name":"new_feed_url","type":"string","required":false,"description":"Address the feed asks clients to move to (maps to `itunes:new-feed-url`). Recorded and surfaced for a person to act on, never followed automatically: a feed naming its own replacement is an instruction from an untrusted document.","format":"url"},{"name":"last_build_date","type":"datetime","required":false,"description":"When the feed says its contents last changed (maps to the channel `lastBuildDate`). Advisory only — some hosts omit it and others regenerate it on every render, so it is not used to decide whether to re-read a feed."},{"name":"episode_count","type":"integer","required":false,"description":"How many items the feed carried when it was last read. Not the show's episode count: some hosts publish only a recent window, and nothing in a feed says it has been truncated."}],"inherited":[],"displayHints":{"from":null,"values":{"title_field":"title","body_field":"description"}},"mergePolicy":null,"versionPolicy":null,"extra":null},"raindrop.collection":{"kind":"type","key":"raindrop.collection","id":"raindrop.collection","label":"Raindrop Collection","description":"A Raindrop collection — a folder that groups raindrops (bookmarks). Collections nest via `parent_id` chains. Source-of-truth for collection metadata; raindrops link back via `collection_id` and a `parent-of` edge.","version":1,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"connectors/raindrop.collection.json","group":"connector:raindrop","fields":[{"name":"title","type":"string","required":true,"description":"Collection name (maps to Raindrop `title`)."},{"name":"slug","type":"string","required":false,"description":"URL-safe slug (maps to Raindrop `slug`)."},{"name":"parent_id","type":"string","required":false,"description":"External Raindrop id of the parent collection (when this collection is nested). Empty / unset at top level."},{"name":"count","type":"integer","required":false,"description":"Number of raindrops in this collection at last sync."},{"name":"cover","type":"string","required":false,"description":"Cover image URL (Raindrop ships one when set)."},{"name":"expanded","type":"boolean","required":false,"description":"Whether the collection is expanded in Raindrop's UI."},{"name":"view","type":"enum","required":false,"description":"Display mode in Raindrop's UI.","enum":["list","simple","grid","masonry"]},{"name":"color","type":"string","required":false,"description":"Operator-assigned color (Raindrop ships free-form CSS strings)."},{"name":"public","type":"boolean","required":false,"description":"Whether the collection has a public URL."},{"name":"created","type":"datetime","required":false,"description":"Creation timestamp upstream."},{"name":"last_update","type":"datetime","required":false,"description":"Last-update timestamp upstream."}],"inherited":[],"displayHints":{"from":null,"values":{"title_field":"title"}},"mergePolicy":null,"versionPolicy":null,"extra":null},"raindrop.raindrop":{"kind":"type","key":"raindrop.raindrop","id":"raindrop.raindrop","label":"Raindrop Bookmark","description":"A Raindrop bookmark — a saved link with title, excerpt, optional note, tags, and a parent collection. Maps onto the cross-app `core.bookmark` shape via `compatible_with`.","version":1,"parent":null,"missingParent":null,"compatibleWith":["core.bookmark"],"compatibleFrom":[],"children":[],"roles":[],"file":"connectors/raindrop.raindrop.json","group":"connector:raindrop","fields":[{"name":"title","type":"string","required":true,"description":"Bookmark title (maps to Raindrop `title`)."},{"name":"body","type":"string","required":false,"description":"Bookmark body — carries Raindrop's `note` so the type satisfies `core.bookmark.body` for cross-app consumers."},{"name":"url","type":"string","required":true,"description":"Target URL (maps to Raindrop `link`).","format":"url"},{"name":"excerpt","type":"string","required":false,"description":"Auto-generated excerpt from the linked page (maps to Raindrop `excerpt`)."},{"name":"note","type":"string","required":false,"description":"User's personal note (mirrors `body`; kept for upstream fidelity)."},{"name":"domain","type":"string","required":false,"description":"Host of the link (Raindrop pre-extracts this)."},{"name":"cover","type":"string","required":false,"description":"Cover image URL (Raindrop auto-extracts one when available).","format":"url"},{"name":"raindrop_type","type":"enum","required":false,"description":"Raindrop's `type` field — what kind of content the link points at. Field-renamed to avoid shadowing Item's first-class `type` column.","enum":["link","article","image","video","document","audio"]},{"name":"tags","type":"array","required":false,"description":"Free-form tags (maps to Raindrop `tags`).","items":"string"},{"name":"created","type":"datetime","required":false,"description":"When the raindrop was saved upstream."},{"name":"last_update","type":"datetime","required":false,"description":"Last-update timestamp upstream."},{"name":"important","type":"boolean","required":false,"description":"Raindrop's `important` flag (operator-set; a starred / pinned marker)."},{"name":"collection_id","type":"string","required":false,"description":"External Raindrop id of the parent collection. Stamped alongside the typed `parent-of` edge so consumers can look up the collection without traversing edges."},{"name":"media","type":"array","required":false,"description":"Array of attached media objects `{ link, type }` (Raindrop carries one per attachment).","items":"object"}],"inherited":[],"displayHints":{"from":null,"values":{"title_field":"title","body_field":"excerpt"}},"mergePolicy":null,"versionPolicy":null,"extra":null},"readwise.book":{"kind":"type","key":"readwise.book","id":"readwise.book","label":"Readwise Book","description":"A source book / article / tweet / podcast in Readwise — the parent that highlights belong to. One row per Readwise `user_book_id`; matches Readwise's `/export/` book payload fields verbatim for upstream fidelity.","version":1,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"connectors/readwise.book.json","group":"connector:readwise","fields":[{"name":"title","type":"string","required":true,"description":"Book / article / tweet title (maps to Readwise `title`)."},{"name":"author","type":"string","required":false,"description":"Author name (maps to Readwise `author`)."},{"name":"category","type":"enum","required":false,"description":"Source category — books | articles | tweets | podcasts (maps to Readwise `category`).","enum":["books","articles","tweets","podcasts"]},{"name":"readwise_source","type":"string","required":false,"description":"How the highlight was imported — e.g. `kindle`, `instapaper`, `manual` (maps to Readwise `source`). Field-renamed to avoid shadowing the first-class `source` column on the items table."},{"name":"source_url","type":"string","required":false,"description":"Stable URL of the original source.","format":"url"},{"name":"cover_image_url","type":"string","required":false,"description":"Book / article cover image (maps to Readwise `cover_image_url`).","format":"url"},{"name":"num_highlights","type":"integer","required":false,"description":"Number of highlights Readwise had captured for this source at sync time."},{"name":"updated","type":"datetime","required":false,"description":"Readwise `updated` timestamp — when the book metadata last changed upstream."}],"inherited":[],"displayHints":{"from":null,"values":{"title_field":"title"}},"mergePolicy":null,"versionPolicy":null,"extra":null},"readwise.document":{"kind":"type","key":"readwise.document","id":"readwise.document","label":"Readwise Reader Document","description":"A document in Readwise Reader — an article, email, feed item, PDF, video or podcast saved to the read-later library. One row per Reader document id; mirrors Reader's `/api/v3/list/` payload for upstream fidelity. Distinct from `readwise.book`, which is the Highlights product's v2 source object.","version":1,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"connectors/readwise.document.json","group":"connector:readwise","fields":[{"name":"title","type":"string","required":true,"description":"Document title (maps to Reader `title`)."},{"name":"author","type":"string","required":false,"description":"Author or byline (maps to Reader `author`)."},{"name":"summary","type":"string","required":false,"description":"Short description of the document, usually the source's own excerpt (maps to Reader `summary`)."},{"name":"category","type":"enum","required":false,"description":"What kind of document this is (maps to Reader `category`). Reader assigns one from the source URL when a save does not name it.","enum":["article","email","epub","highlight","note","pdf","podcast","rss","tweet","video"]},{"name":"location","type":"enum","required":false,"description":"Which Reader triage bucket the document sits in (maps to Reader `location`). Only `new`, `later`, `archive` and `feed` can be written; `shortlist` is readable but a write naming it is silently stored as `new`.","enum":["new","later","shortlist","archive","feed"]},{"name":"reader_url","type":"string","required":false,"description":"Deep link to the document in Reader (maps to Reader `url`). Assigned by Reader, not by the saver, so it is absent until the document exists upstream.","format":"url"},{"name":"source_url","type":"string","required":false,"description":"URL of the original content (maps to Reader `source_url`). Reader deduplicates saves on this value, which makes it the natural key for a create.","format":"url"},{"name":"site_name","type":"string","required":false,"description":"Publication or site the document came from (maps to Reader `site_name`)."},{"name":"readwise_source","type":"string","required":false,"description":"How the document entered Reader — e.g. `Reader RSS`, `reader-mobile-app`, `api` (maps to Reader `source`). Field-renamed to avoid shadowing the first-class `source` column on the items table."},{"name":"word_count","type":"integer","required":false,"description":"Word count of the extracted text, where Reader computed one."},{"name":"reading_time","type":"string","required":false,"description":"Human-readable estimated reading time, e.g. `4 mins` (maps to Reader `reading_time`). A string upstream, not a number."},{"name":"listening_time","type":"string","required":false,"description":"Human-readable estimated listening time for audio documents (maps to Reader `listening_time`)."},{"name":"reading_progress","type":"number","required":false,"description":"How far through the document the reader has got, from 0 to 1 (maps to Reader `reading_progress`)."},{"name":"published_date","type":"datetime","required":false,"description":"When the original content was published (maps to Reader `published_date`). Reader returns a bare calendar date and accepts a full instant on write, so both shapes are allowed."},{"name":"image_url","type":"string","required":false,"description":"Cover or hero image for the document (maps to Reader `image_url`).","format":"url"},{"name":"notes","type":"string","required":false,"description":"The reader's own note on the document as a whole (maps to Reader `notes`). Distinct from notes attached to individual highlights, which the v3 API cannot write."},{"name":"tags","type":"array","required":false,"description":"Tag names applied to the document. Reader reads tags back as an object keyed by name and takes a plain list on write; this holds the normalized list of names.","items":"string","maxItems":200},{"name":"saved_at","type":"datetime","required":false,"description":"When the document was saved to Reader (maps to Reader `saved_at`)."},{"name":"updated","type":"datetime","required":false,"description":"When the document last changed upstream (maps to Reader `updated_at`). Field-renamed to avoid shadowing the first-class `updated_at` column on the items table."},{"name":"last_moved_at","type":"datetime","required":false,"description":"When the document last changed triage bucket (maps to Reader `last_moved_at`)."},{"name":"first_opened_at","type":"datetime","required":false,"description":"When the document was first opened in Reader (maps to Reader `first_opened_at`)."},{"name":"last_opened_at","type":"datetime","required":false,"description":"When the document was last opened in Reader (maps to Reader `last_opened_at`)."}],"inherited":[],"displayHints":{"from":null,"values":{"title_field":"title"}},"mergePolicy":null,"versionPolicy":null,"extra":null},"readwise.highlight":{"kind":"type","key":"readwise.highlight","id":"readwise.highlight","label":"Readwise Highlight","description":"A highlight / annotation captured in Readwise. The quoted text lands in `text` and the user's personal annotation in `note`. Deliberately not `compatible_with: core.note` — a note requires `body`, and renaming this type's `text` field would orphan the property on every highlight already captured. Readers wanting the cross-app shape should project through the display hints.","version":1,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"connectors/readwise.highlight.json","group":"connector:readwise","fields":[{"name":"text","type":"string","required":true,"description":"Highlight body (the actual quoted text). Required; no separate title."},{"name":"note","type":"string","required":false,"description":"User's personal annotation on the highlight (maps to Readwise `note`)."},{"name":"location","type":"integer","required":false,"description":"Numerical location within the source (maps to Readwise `location` — meaning depends on `location_type`)."},{"name":"location_type","type":"enum","required":false,"description":"What `location` means — page | location (Kindle) | offset | order | time_offset (podcast) | none.","enum":["page","location","offset","order","time_offset","none"]},{"name":"color","type":"string","required":false,"description":"Highlight color as reported by Readwise (e.g. `yellow`, `blue`)."},{"name":"tags","type":"array","required":false,"description":"Free-form tags attached to the highlight (maps to Readwise `tags`).","items":"string"},{"name":"highlighted_at","type":"datetime","required":false,"description":"When the user highlighted the source."},{"name":"updated","type":"datetime","required":false,"description":"Readwise `updated` timestamp — when the highlight last changed upstream."},{"name":"url","type":"string","required":false,"description":"Deep link to the highlight on readwise.io","format":"url"},{"name":"book_id","type":"string","required":false,"description":"External Readwise `user_book_id` of the parent book. Read-only; persisted alongside the typed `parent-of` edge so consumers can look up the parent book without traversing edges."}],"inherited":[],"displayHints":{"from":null,"values":{"title_field":"text","body_field":"note"}},"mergePolicy":null,"versionPolicy":null,"extra":null},"todoist.task":{"kind":"type","key":"todoist.task","id":"todoist.task","label":"Todoist Task","description":"A task on a Todoist project, captured with upstream fidelity. Mirrors Todoist's Sync API item resource closely so a round-trip preserves what Todoist considers authoritative (content, description, project_id, section_id, parent_id, labels, priority, due, child_order, completed, url, comment_count). Deliberately not `compatible_with: core.task` — the two disagree on `priority`, which is Todoist's integer 1-4 here and a `low | medium | high | urgent` enum there, so a `core.task` reader would be handed `4` where it expects `\"urgent\"`. Retyping the field would both discard the upstream fidelity this type exists for and orphan the property on every task already captured. The Todoist connector can be configured to write `core.task` instead when cross-app interop matters more than fidelity.","version":1,"parent":null,"missingParent":null,"compatibleWith":[],"compatibleFrom":[],"children":[],"roles":[],"file":"connectors/todoist.task.json","group":"connector:todoist","fields":[{"name":"title","type":"string","required":true,"description":"Task title (maps to Todoist `content`)."},{"name":"description","type":"string","required":false,"description":"Free-text description attached to the task (maps to Todoist `description`)."},{"name":"project_id","type":"string","required":false,"description":"Todoist project id the task lives on. Inbox project is the default when this field is unset."},{"name":"section_id","type":"string","required":false,"description":"Todoist section id within the project, when the task is grouped under a section."},{"name":"parent_id","type":"string","required":false,"description":"Parent task id when this task is a subtask (Todoist allows arbitrary nesting depth)."},{"name":"labels","type":"array","required":false,"description":"Label names attached to the task (maps to Todoist `labels`). Free-form strings.","items":"string"},{"name":"priority","type":"integer","required":false,"description":"Task priority (1 = no priority through 4 = urgent, matching Todoist's wire convention)."},{"name":"due","type":"object","required":false,"description":"Due date/time object. Carries any of `{ date, datetime, string, lang, is_recurring, timezone }`; `null` when the task has no due date."},{"name":"child_order","type":"integer","required":false,"description":"Stable sort order within the parent (maps to Todoist `child_order`)."},{"name":"completed","type":"boolean","required":false,"description":"Mirrors Todoist's `checked` flag. Closing a task in Marfa (state transition to trashed) maps to Todoist's `/close` endpoint, which sets this to true upstream."},{"name":"url","type":"string","required":false,"description":"Stable HTTPS link to the task on the Todoist web UI.","format":"url"},{"name":"comment_count","type":"integer","required":false,"description":"Number of comments on the task at last sync (maps to Todoist `comment_count`)."}],"inherited":[],"displayHints":{"from":null,"values":{"title_field":"title","body_field":"description"}},"mergePolicy":null,"versionPolicy":null,"extra":null},"edge/about":{"kind":"edge","key":"edge/about","id":"about","label":"About","description":"Source item is about the target item. Topical connection between items across types.","cardinality":"many-to-many","cascade":"orphan","source":[{"kind":"any"}],"target":[{"kind":"any"}],"fields":[],"file":"core/edges/about.json","group":"edges","extra":null},"edge/attached-to":{"kind":"edge","key":"edge/attached-to","id":"attached-to","label":"Attached to","description":"Source is an attachment (a file or media item) belonging to the target. Many-to-many: a file may be attached to multiple hosts; a host may have multiple attachments. Deleting the host orphans the attachment (it may still be attached to other items).","cardinality":"many-to-many","cascade":"orphan","source":[{"kind":"any"}],"target":[{"kind":"any"}],"fields":[],"file":"core/edges/attached-to.json","group":"edges","extra":null},"edge/authored-by":{"kind":"edge","key":"edge/authored-by","id":"authored-by","label":"Authored by","description":"Source was authored by the target (usually a core.entity.person).","cardinality":"many-to
