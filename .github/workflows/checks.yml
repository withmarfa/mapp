name: Checks

# Each job runs only when its files changed, so a docs-only change finishes in seconds.
# - A draft pull request runs no Swift job; marking it ready runs them once. Builders test locally first.
# - A change that touches only the String Catalog, assets or UI tests compiles everything but does not run the
#   unit tests. Views are not left out, since several unit tests host views.
# - The release configuration is built after a merge to main (`release-build.yml`), not here: Mac runners are few,
#   and the tag build and `release.yml`'s dry run compile Release before a release too.
# - The unit tests run one at a time with a 12 minute limit; a run that reaches it uploads samples of its test host
#   as the `unit-test-diagnostics` artifact and fails. A failed test fails the check, and nothing is retried.
# - The UI tests are only built here, and only when they, the test plans or the project change: their target
#   imports only XCTest, AppKit and os, so app code cannot break their compile. They take over the keyboard and
#   mouse, so they run locally when a change needs them.
# - A change to a workflow is checked by actionlint.
# - The instruction check (`Scripts/check-instructions.py`) is cheap, so it runs on drafts too. It runs for any
#   Markdown file, `project.pbxproj`, Swift or editor source (a renamed type can leave a doc stale), the script
#   or this workflow.
# - The release scripts (`Scripts/release/`) have unit tests, run when they or this workflow change. `release.yml` publishes tagged
#   releases and rehearses itself on a change to the release files; it is not part of `Checks`.
# The final job, "Checks", is the one required check. It runs after every job, and after a cancelled run when a job
# failed. A run that a newer push cancelled ends it as cancelled, not failed, and a cancelled check never passes.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      editor: ${{ steps.filter.outputs.editor }}
      swift: ${{ steps.filter.outputs.swift }}
      logic: ${{ steps.filter.outputs.logic }}
      uitests: ${{ steps.filter.outputs.uitests }}
      scripts: ${{ steps.filter.outputs.scripts }}
      workflows: ${{ steps.filter.outputs.workflows }}
      instructions: ${{ steps.filter.outputs.instructions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: filter
        # The first parent of the merge commit is the base, so this diff is the pull request's own change.
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          if echo "$files" | grep -qE '^(editor/|MarfaMac/Editor/Page/|\.github/workflows/checks\.yml$)'; then
            echo "editor=true" >> "$GITHUB_OUTPUT"
          fi
          app=$(echo "$files" | grep -vE '\.md$' | grep -E '^(MarfaMac/|MarfaMacTests/|MarfaMacUITests/|MarfaMac\.xcodeproj/|TestPlans/|Config/|\.github/workflows/checks\.yml$|\.github/scripts/)' || true)
          if [ -n "$app" ]; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          fi
          # Anything outside the String Catalog, assets and UI tests may change logic. Views count: several unit
          # tests host them.
          logic=$(echo "$app" | grep -vE '^(MarfaMac/Localizable\.xcstrings$|MarfaMac/Assets\.xcassets/|MarfaMacUITests/)' || true)
          if [ -n "$logic" ]; then
            echo "logic=true" >> "$GITHUB_OUTPUT"
          fi
          # The UI test target compiles only its own folder, under the project's settings and the test plans.
          if echo "$app" | grep -qE '^(MarfaMacUITests/|TestPlans/|MarfaMac\.xcodeproj/|\.github/workflows/checks\.yml$)'; then
            echo "uitests=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -qE '^(Scripts/release/|\.github/workflows/checks\.yml$)'; then
            echo "scripts=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -qE '^\.github/(workflows/|actionlint\.ya?ml$)'; then
            echo "workflows=true" >> "$GITHUB_OUTPUT"
          fi
          # Docs name types and files in the source, so a source change can make a doc untrue.
          if echo "$files" | grep -qE '(\.md|\.swift|project\.pbxproj)$|^(editor/src/|Scripts/check-instructions\.py$|\.github/workflows/checks\.yml$)'; then
            echo "instructions=true" >> "$GITHUB_OUTPUT"
          fi

  editor:
    name: Editor
    needs: changes
    if: needs.changes.outputs.editor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: editor/package.json
          cache: true
          cache_dependency_path: editor/pnpm-lock.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm format:check
      - name: Rebuild the page and compare
        run: |
          pnpm build
          git diff --exit-code -- ../MarfaMac/Editor/Page/

  actionlint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release archive, checked against the digest that its release publishes, so the tool is the one reviewed.
      - name: Install actionlint
        run: |
          version=1.7.12
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
      - run: ./actionlint -color

  instructions:
    name: Instructions
    needs: changes
    if: needs.changes.outputs.instructions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 Scripts/check-instructions.py
      - name: Fail on purpose
        run: exit 1

  release-scripts:
    name: Release scripts
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s Scripts/release -v

  swift:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.swift == 'true' && github.event.pull_request.draft == false
    # The hosted image with Xcode 27 (a public preview at the time of writing).
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      # The build and the tests are separate steps, so the tests get a limit of their own: a stall then ends
      # in minutes, with a sample of the blocked process, instead of at the job's limit.
      - name: Build the app and unit tests
        run: >
          xcodebuild -project MarfaMac.xcodeproj -scheme MarfaMac -testPlan Unit -destination 'platform=macOS'
          -derivedDataPath build build-for-testing
      - name: Run the unit tests
        if: needs.changes.outputs.logic == 'true'
        run: .github/scripts/run-unit-tests.sh 720 diagnostics
      - name: Upload the stall diagnostics
        if: failure() && hashFiles('diagnostics/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-diagnostics
          path: diagnostics
      # The UI tests take over the keyboard and mouse, so they run locally when a change needs them; here they
      # are only built, so a change that breaks them is seen.
      - name: Build the UI tests
        if: needs.changes.outputs.uitests == 'true'
        run: >
          xcodebuild -project MarfaMac.xcodeproj -scheme 'MarfaMac UI Tests' -destination 'platform=macOS'
          -derivedDataPath build build-for-testing
      - name: Show failures
        if: failure() && hashFiles('TestResults.xcresult/**') != ''
        run: |
          xcrun xcresulttool get test-results tests --path TestResults.xcresult --compact \
            | python3 -c "
          import collections, json, sys
          seen = collections.Counter()
          def walk(n):
              if n.get('nodeType') == 'Failure Message':
                  seen[n.get('name', '')[:300]] += 1
              for c in n.get('children', []):
                  walk(c)
          for n in json.load(sys.stdin)['testNodes']:
              walk(n)
          for message, count in seen.most_common(15):
              print('::warning::%dx %s' % (count, message))
          "

  checks:
    name: Checks
    needs: [changes, editor, actionlint, instructions, release-scripts, swift]
    if: ${{ !cancelled() || contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job that ran to pass
        run: |
          [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "false" ]]
