name: Checks

# Changes selects jobs by path. An unmatched path selects all regular checks, including the Swift unit tests.
# Workflow and classifier changes get Linux checks. A draft also runs only Linux checks.
# Swift starts on ready pull requests after any selected Instructions and Editor checks pass.
# The String Catalog, assets and UI tests require a build only. CI builds UI tests only when their files,
# plans or project change. Run UI tests locally with the screen free.
# Unit tests run serially with a 12-minute limit and upload diagnostics on a stall. CI retries nothing.
# Checks is the required roll-up. A superseded run reports cancellation unless a job failed.
# Release build and publishing run in release-build.yml and release.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      editor: ${{ steps.filter.outputs.editor }}
      swift: ${{ steps.filter.outputs.swift }}
      logic: ${{ steps.filter.outputs.logic }}
      uitests: ${{ steps.filter.outputs.uitests }}
      scripts: ${{ steps.filter.outputs.scripts }}
      classifier: ${{ steps.filter.outputs.classifier }}
      workflows: ${{ steps.filter.outputs.workflows }}
      instructions: ${{ steps.filter.outputs.instructions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: filter
        # The first parent of the merge commit is the base, so this diff is the pull request's own change.
        shell: bash
        run: |
          git diff --no-renames --name-only -z HEAD^1 HEAD |
            python3 .github/scripts/classify_changes.py >> "$GITHUB_OUTPUT"

  editor:
    name: Editor
    needs: changes
    if: needs.changes.outputs.editor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: editor/package.json
          cache: true
          cache_dependency_path: editor/pnpm-lock.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm format:check
      - name: Rebuild the page and compare
        run: |
          pnpm build
          git diff --exit-code -- ../MarfaMac/Editor/Page/

  actionlint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release archive, checked against the digest that its release publishes, so the tool is the one reviewed.
      - name: Install actionlint
        run: |
          version=1.7.12
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
      - run: ./actionlint -color

  instructions:
    name: Instructions
    needs: changes
    if: needs.changes.outputs.instructions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 Scripts/check-instructions.py

  release-scripts:
    name: Script tests
    needs: changes
    if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.classifier == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release scripts
        if: needs.changes.outputs.scripts == 'true'
        run: python3 -m unittest discover -s Scripts/release -v
      - name: Test the change classifier
        if: needs.changes.outputs.classifier == 'true'
        run: python3 -m unittest discover -s .github/scripts -v

  swift:
    name: Unit tests
    needs: [changes, instructions, editor]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.instructions.result == 'success' || needs.instructions.result == 'skipped') &&
      (needs.editor.result == 'success' || needs.editor.result == 'skipped') &&
      needs.changes.outputs.swift == 'true' &&
      github.event.pull_request.draft == false
    # The hosted image with Xcode 27 (a public preview at the time of writing).
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      # The build and the tests are separate steps, so the tests get a limit of their own: a stall then ends
      # in minutes, with a sample of the blocked process, instead of at the job's limit.
      - name: Build the app and unit tests
        run: >
          xcodebuild -project MarfaMac.xcodeproj -scheme MarfaMac -testPlan Unit -destination 'platform=macOS'
          -derivedDataPath build build-for-testing
      - name: Run the unit tests
        if: needs.changes.outputs.logic == 'true'
        run: .github/scripts/run-unit-tests.sh 720 diagnostics
      - name: Upload the stall diagnostics
        if: failure() && hashFiles('diagnostics/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-diagnostics
          path: diagnostics
      # The UI tests take over the keyboard and mouse, so they run locally when a change needs them; here they
      # are only built, so a change that breaks them is seen.
      - name: Build the UI tests
        if: needs.changes.outputs.uitests == 'true'
        run: >
          xcodebuild -project MarfaMac.xcodeproj -scheme 'MarfaMac UI Tests' -destination 'platform=macOS'
          -derivedDataPath build build-for-testing
      - name: Show failures
        if: failure() && hashFiles('TestResults.xcresult/**') != ''
        run: |
          xcrun xcresulttool get test-results tests --path TestResults.xcresult --compact \
            | python3 -c "
          import collections, json, sys
          seen = collections.Counter()
          def walk(n):
              if n.get('nodeType') == 'Failure Message':
                  seen[n.get('name', '')[:300]] += 1
              for c in n.get('children', []):
                  walk(c)
          for n in json.load(sys.stdin)['testNodes']:
              walk(n)
          for message, count in seen.most_common(15):
              print('::warning::%dx %s' % (count, message))
          "

  checks:
    name: Checks
    needs: [changes, editor, actionlint, instructions, release-scripts, swift]
    if: ${{ !cancelled() || contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job that ran to pass
        run: |
          [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "false" ]]
